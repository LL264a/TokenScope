<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 440px;
      min-height: 420px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 14px;
    }
    .header {
      text-align: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
      position: relative;
    }
    .header h1 { font-size: 17px; font-weight: 700; color: #4ade80; }
    .header .server { font-size: 11px; color: #64748b; margin-top: 2px; }
    .log-btn {
      position: absolute; top: 0; right: 0; font-size: 18px; cursor: pointer; color: #64748b;
      background: none; border: none; padding: 4px;
    }
    .log-btn:hover { color: #e2e8f0; }
    .section-title { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

    /* 密钥区 */
    .key-row { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
    .key-row input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 7px 10px; color: #e2e8f0; font-size: 11px; outline: none; }
    .key-row input:focus { border-color: #059669; }
    .key-status { font-size: 11px; margin-bottom: 10px; }

    /* 平台卡片 */
    .platform-card {
      background: #1e293b;
      border-radius: 8px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .platform-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
    }
    .platform-header .name { flex:1; font-weight:600; font-size:13px; }
    .platform-header .status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }
    .dot-gray { background:#475569; }
    .dot-green { background:#4ade80; }
    .dot-blue { background:#3b82f6; }
    .dot-red { background:#ef4444; }
    .platform-body { padding: 0 10px 10px; display: none; }
    .platform-body.open { display: block; }
    .platform-body input {
      width:100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      color: #e2e8f0;
      font-size: 12px;
      outline: none;
      margin-bottom: 6px;
    }
    .platform-body input:focus { border-color: #4ade80; }
    .platform-body input::placeholder { color: #475569; }
    .row2 { display:flex; gap:6px; }
    .row2 input { flex:1; }
    .row2 .pf-save { flex-shrink:0; }

    .btn-sm {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary { background: #059669; color: white; }
    .btn-primary:hover { background: #047857; }
    .btn-warning { background: #d97706; color: white; }
    .btn-warning:hover { background: #b45309; }
    .btn-danger { background: #b91c1c; color: white; }
    .btn-danger:hover { background: #991b1b; }
    .btn-outline { background: transparent; color: #94a3b8; border: 1px solid #334155; }
    .btn-outline:hover { background: #1e293b; }
    .btn-sm:disabled { opacity:0.4; cursor:not-allowed; }
    .launch-row { display:flex; gap:6px; align-items:center; margin-top:4px; }
    .launch-row .btn-sm { flex:1; }
    .all-btn {
      width:100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #064e3b;
      color: #4ade80;
      margin-bottom: 6px;
    }
    .all-btn:hover { background: #065f46; }
    .all-btn:disabled { opacity:0.4; cursor:not-allowed; }

    /* 日志面板 */
    .log-panel {
      display: none;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 11px;
      font-family: monospace;
    }
    .log-panel.open { display: block; }
    .log-entry { padding: 2px 0; border-bottom: 1px solid #0a0f1e; }
    .log-time { color: #64748b; margin-right: 6px; }
    .log-info { color: #94a3b8; }
    .log-ok { color: #4ade80; }
    .log-err { color: #ef4444; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
      color: #64748b;
    }
    .toast {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid #334155; border-radius: 6px;
      padding: 6px 14px; font-size: 12px; white-space: nowrap;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
      max-width: 90%; text-align: center; z-index: 9999;
    }
    .toast.show { opacity: 1; }
    .toast.success { border-color: #059669; color: #4ade80; }
    .toast.error { border-color: #b91c1c; color: #ef4444; }
    .toggle-link { font-size: 11px; color: #3b82f6; cursor: pointer; }
    .toggle-link:hover { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔭 TokenScope</h1>
    <div class="server">ait.ll264a.cn</div>
    <button class="log-btn" id="toggle-log" title="插件日志">📋</button>
  </div>

  <!-- 日志面板 -->
  <div class="log-panel" id="log-panel"></div>

  <!-- 密钥区 -->
  <div id="setup-box">
    <div class="section-title">🔑 API 密钥</div>
    <div class="key-row">
      <input type="text" id="api-key-input" placeholder="粘贴密钥 (名称|种子)" autocomplete="off">
      <button class="btn-sm btn-primary" id="save-key-btn">保存</button>
      <button class="btn-sm btn-warning" id="change-key-btn" style="display:none">更新</button>
      <button class="btn-sm btn-danger" id="clear-key-btn" style="display:none">清除</button>
    </div>
    <div id="key-status" class="key-status" style="color:#94a3b8">未配置</div>
  </div>

  <!-- 有 Cookie 的平台列表 -->
  <div class="section-title" id="platform-title">🌐 已采集的平台</div>
  <div id="platforms">
    <div style="text-align:center;color:#475569;padding:20px;font-size:13px">正在加载...</div>
  </div>

  <!-- 一键打开 -->
  <button class="all-btn" id="launch-all" disabled>⚡ 一键打开全部平台</button>

  <div class="status-bar">
    <span id="status-text">就绪</span>
    <span id="status-auth">未认证</span>
  </div>

  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
