<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Token 监控面板</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='10.5' y='1' width='3' height='14' rx='1.5' fill='%2360a5fa'/%3E%3Crect x='3.5' y='3.5' width='17' height='3' rx='1.5' fill='%23c084fc'/%3E%3Ccircle cx='12' cy='12' r='7' stroke='%234ade80' stroke-width='1.5' fill='none'/%3E%3Ctext x='12' y='15' text-anchor='middle' font-family='system-ui,sans-serif' font-size='9' font-weight='700' fill='%234ade80'%3ET%3C/text%3E%3C/svg%3E">
    <script>/* 版本号 */ const APP_VERSION = 'v1.9.2';</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* ====== 顶栏 ====== */
        .top-bar {
            background: linear-gradient(135deg, #1a1f35, #0f172a);
            border-bottom: 1px solid #1e293b;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 {
            font-size: 20px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }
        .top-bar .meta {
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .top-bar .nav-btns { display: flex; gap: 8px; }
        .top-bar .nav-btns button {
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            background: #111827;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .top-bar .nav-btns button:hover { border-color: #60a5fa; color: #60a5fa; }
        .top-bar .nav-btns button.active { background: #1e3a5f; border-color: #60a5fa; color: #60a5fa; }
        .live-dot {
            width: 6px; height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: blink 2s infinite;
            display: inline-block;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

        .container { max-width: 1600px; margin: 0 auto; padding: 24px; }

        /* ====== 移动端适配 ====== */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .platform-grid {
                grid-template-columns: 1fr !important;
                gap: 12px;
            }
            .plan-card { border-radius: 12px; }
            .card-header { padding: 14px 16px; }
            .card-header .title { font-size: 16px !important; }
            .card-header .subtitle { font-size: 11px; }
            .status-badge { font-size: 10px; padding: 3px 8px; }
            .plan-info { padding: 12px 16px; gap: 10px; font-size: 11px; }
            .quota-hero .remaining-value { font-size: 26px !important; }
            .tokenplan-body { padding: 12px 16px !important; }
            .detail-grid { gap: 8px; }
            .detail-item { padding: 10px 12px; }
            .detail-item .val { font-size: 14px; }
            .detail-item .label { font-size: 10px; }
            .xiaomi-section { padding: 12px 16px; }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] {
                gap: 6px !important;
                flex-wrap: nowrap !important;
                white-space: nowrap;
                overflow-x: auto;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span {
                white-space: nowrap;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:24px"] {
                font-size: 16px !important;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:28px"] {
                font-size: 18px !important;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:16px"] {
                font-size: 12px !important;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:12px"] {
                font-size: 10px !important;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:13px"] {
                font-size: 11px !important;
            }
            .card-footer { padding: 10px 16px; font-size: 10px; }
            .exhausted-text { font-size: 20px; }
            /* 火山余额 */
            .tokenplan-body > div > div[style*="font-size:36px"] {
                font-size: 28px !important;
            }
            /* DeepSeek 余额 */
            .plan-card > div[style*="padding:8px 16px"] > div > div > div[style*="font-size:26px"] {
                font-size: 20px !important;
            }
            .plan-card > div[style*="padding:8px 16px"] > div > div > div[style*="font-size:24px"] {
                font-size: 18px !important;
            }
            /* 模型详情卡片 */
            .plan-card > div[style*="padding:0 16px"] > div > div[style*="display:flex;gap:8px"] {
                flex-wrap: wrap !important;
            }
            .plan-card > div[style*="padding:0 16px"] > div > div[style*="display:flex;gap:8px"] > div {
                flex: 1 1 45% !important;
                margin-bottom: 4px;
            }
            /* 余额横幅三列变列 */
            div[style*="display:flex;justify-content:space-evenly"] {
                flex-wrap: wrap !important;
                gap: 8px;
            }
            .cred-table { font-size: 11px; }
            .cred-table th, .cred-table td { padding: 6px 8px; }
            .admin-card .btn { font-size: 11px; padding: 4px 8px; }
            /* 顶栏移动端 */
            .top-bar { padding: 10px 12px; gap: 4px; }
            .top-bar h1 { font-size: 14px; }
            .top-bar h1 span { display: block; font-size: 10px !important; text-align: left; }
            .top-bar .nav-btns { gap: 4px; }
            .top-bar .nav-btns button { font-size: 13px; padding: 4px 8px; }
            .top-bar .nav-btns button .btn-label { display: none; }
            .top-bar .meta > span:first-child { display: none; }
            .top-bar .meta > span:nth-child(2) > span:first-child { display: none; }
            .top-bar .meta > span:not(:first-child) { font-size: 10px; }
        }
        @media (max-width: 480px) {
            .card-header .title { font-size: 14px !important; }
            .quota-hero .remaining-value { font-size: 22px !important; }
            .detail-item .val { font-size: 13px; }
            .status-badge { font-size: 9px; padding: 2px 6px; }
        }

        /* ====== Cookie 失效警告横幅 ====== */
        .cookie-alert {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
            border: 1px solid #dc2626;
            border-radius: 10px;
            padding: 10px 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #fca5a5;
            animation: alertPulse 2s ease-in-out infinite;
        }
        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.3); }
            50% { box-shadow: 0 0 20px 4px rgba(220, 38, 38, 0.2); }
        }

        /* ====== 页面切换 ====== */
        .page { display: none; }
        .page.active { display: block; }

        /* ====== 平台卡片网格 ====== */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        @media (min-width: 1400px) {
            .platform-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* ====== 卡片基础 ====== */
        .plan-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        .card-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        .card-header .title { font-size: 18px; font-weight: 700; color: #f1f5f9; }
        .card-header .subtitle { font-size: 13px; color: #64748b; margin-top: 2px; }
        .status-badge { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
        .badge-available { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-warning   { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .badge-exhausted { background: rgba(239,68,68,0.15); color: #f87171; }

        .plan-info {
            padding: 16px 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #94a3b8;
            border-bottom: 1px solid #1e293b;
        }
        .plan-info span { display: flex; align-items: center; gap: 4px; }

        /* ====== Coding Plan: 三层配额 ====== */
        .quota-body { padding: 20px 24px; }
        .quota-item { margin-bottom: 16px; }
        .quota-item:last-child { margin-bottom: 0; }
        .quota-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .quota-label { font-size: 14px; font-weight: 500; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
        .quota-total-hint { font-size: 12px; color: #64748b; font-weight: 400; }
        .quota-remaining { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .progress-track { width: 100%; height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 5px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fill-green { background: linear-gradient(90deg, #22c55e, #4ade80); }
        .fill-yellow { background: linear-gradient(90deg, #eab308, #fbbf24); }
        .fill-red { background: linear-gradient(90deg, #dc2626, #f87171); }
        .quota-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .quota-pct { font-size: 12px; font-weight: 600; }
        .quota-refresh { font-size: 11px; color: #4b5563; }

        /* ====== 传统计划 ====== */
        .tokenplan-body { padding: 24px; }

        /* ====== MIMO 卡片区块 ====== */
        .xiaomi-section {
            padding: 16px 24px;
            border-bottom: 1px solid #1e293b;
        }
        .xiaomi-section:last-of-type { border-bottom: none; }
        .quota-hero { text-align: center; margin-bottom: 20px; }
        .quota-hero .remaining-label { font-size: 13px; color: #64748b; margin-bottom: 4px; }
        .quota-hero .remaining-value { font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
        .quota-hero .remaining-unit { font-size: 16px; font-weight: 400; color: #94a3b8; margin-left: 4px; }
        .quota-hero .total-hint { font-size: 12px; color: #4b5563; margin-top: 4px; }
        .progress-section { margin-bottom: 20px; }
        .progress-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .detail-item { background: #0d1117; border-radius: 10px; padding: 14px 16px; }
        .detail-item .label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
        .detail-item .val { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

        .card-footer {
            padding: 12px 24px;
            background: #0d1117;
            font-size: 11px;
            color: #4b5563;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ====== 腾讯子服务 ====== */
        .sub-service { border-bottom: 1px solid #1e293b; position: relative; }
        .sub-service:last-of-type { border-bottom: none; }
        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #0d1117;
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
        }
        .sub-hide-btn {
            background: none; border: none; color: #4b5563; font-size: 16px;
            cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.2s;
            line-height: 1;
        }
        .sub-hide-btn:hover { color: #ef4444; background: rgba(239,68,68,0.1); }
        .sub-hide-btn.disabled { opacity: 0.3; cursor: not-allowed; }
        .sub-hide-btn.disabled:hover { color: #4b5563; background: none; }

        /* ====== 蓝色遮罩：额度已用尽 ====== */
        .exhausted-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 64, 175, 0.25);
            backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; animation: fadeIn 0.5s ease;
        }
        .exhausted-text { font-size: 28px; font-weight: 800; color: #ef4444; text-shadow: 0 0 20px rgba(239,68,68,0.5); letter-spacing: 4px; margin-bottom: 12px; }
        .exhausted-recovery { font-size: 14px; color: #93c5fd; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .exhausted-recovery .time { font-size: 16px; font-weight: 600; color: #bfdbfe; }
        .exhausted-recovery .countdown { font-size: 13px; color: #60a5fa; }

        /* 子服务级别遮罩（文字稍小） */
        .sub-exhausted-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 64, 175, 0.25);
            backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; animation: fadeIn 0.5s ease;
        }
        .sub-exhausted-overlay .exhausted-text { font-size: 20px; letter-spacing: 3px; margin-bottom: 8px; }
        .sub-exhausted-overlay .exhausted-recovery { font-size: 12px; }
        .sub-exhausted-overlay .exhausted-recovery .time { font-size: 14px; }
        .sub-exhausted-overlay .exhausted-recovery .countdown { font-size: 12px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ====== 颜色工具 ====== */
        .green { color: #4ade80; }
        .yellow { color: #fbbf24; }
        .red { color: #f87171; }
        .blue { color: #60a5fa; }

        .empty-state { text-align: center; padding: 40px; color: #4b5563; }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
        .empty-state .msg { font-size: 14px; margin-bottom: 8px; }
        .empty-state .hint { font-size: 12px; color: #64748b; }

        /* ====== 认证相关 ====== */
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
        }
        .auth-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 40px 32px;
        }
        .auth-card .auth-icon { font-size: 48px; margin-bottom: 16px; }
        .auth-card .auth-title { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
        .auth-card .auth-desc { font-size: 13px; color: #64748b; margin-bottom: 24px; }
        .auth-card .form-group { margin-bottom: 16px; text-align: left; }
        .auth-card .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        .auth-card .form-group input {
            width: 100%; padding: 12px 16px;
            background: #0d1117; border: 1px solid #1e293b; border-radius: 8px;
            color: #e2e8f0; font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .auth-card .form-group input:focus { border-color: #60a5fa; }
        .auth-card .auth-error { font-size: 12px; color: #f87171; margin-top: 8px; min-height: 18px; }
        .auth-card .btn { width: 100%; padding: 12px; font-size: 14px; }

        .admin-locked-notice {
            text-align: center; padding: 60px 20px; color: #4b5563;
        }
        .admin-locked-notice .icon { font-size: 48px; margin-bottom: 16px; }
        .admin-locked-notice .msg { font-size: 16px; margin-bottom: 8px; color: #94a3b8; }
        .admin-locked-notice .hint { font-size: 12px; color: #64748b; }

        /* 登出按钮 */
        .logout-btn {
            padding: 4px 12px; border-radius: 6px; border: 1px solid #1e293b;
            background: transparent; color: #64748b; font-size: 12px; cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

        /* ====== 管理后台 ====== */
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .admin-card { background: #111827; border: 1px solid #1e293b; border-radius: 14px; padding: 24px; }
        .admin-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .admin-card.full-width { grid-column: 1 / -1; }
        .cred-table { width: 100%; border-collapse: collapse; }
        .cred-table th { text-align: left; padding: 10px 12px; font-size: 12px; color: #64748b; border-bottom: 1px solid #1e293b; }
        .cred-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #0d1117; }
        .cred-type-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .type-cookie { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .type-api_key { background: rgba(96,165,250,0.15); color: #60a5fa; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        .form-group select, .form-group input, .form-group textarea {
            width: 100%; padding: 10px 14px;
            background: #0d1117; border: 1px solid #1e293b; border-radius: 8px;
            color: #e2e8f0; font-size: 13px; outline: none; transition: border-color 0.2s;
        }
        .form-group select:focus, .form-group input:focus, .form-group textarea:focus { border-color: #60a5fa; }
        .form-group textarea { min-height: 80px; font-family: 'Consolas', 'Fira Code', monospace; font-size: 12px; resize: vertical; }
        .form-hint { font-size: 11px; color: #4b5563; margin-top: 4px; }

        .btn { padding: 8px 20px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #991b1b; color: #fca5a5; }
        .btn-danger:hover { background: #7f1d1d; }
        .btn-success { background: #166534; color: #86efac; }
        .btn-success:hover { background: #14532d; }
        .btn-warning { background: #854d0e; color: #fde68a; }
        .btn-warning:hover { background: #713f12; }
        .btn-outline { background: transparent; border: 1px solid #1e293b; color: #94a3b8; }
        .btn-outline:hover { border-color: #60a5fa; color: #60a5fa; }
        .btn-row { display: flex; gap: 8px; align-items: center; }

        .scheduler-status { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .status-dot-admin { width: 10px; height: 10px; border-radius: 50%; }
        .dot-running { background: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.5); }
        .dot-stopped { background: #6b7280; }
        .interval-control { display: flex; align-items: center; gap: 8px; }
        .interval-control input { width: 80px; padding: 6px 10px; background: #0d1117; border: 1px solid #1e293b; border-radius: 6px; color: #e2e8f0; font-size: 13px; text-align: center; }

        .log-table { width: 100%; border-collapse: collapse; }
        .log-table th { text-align: left; padding: 8px 10px; font-size: 11px; color: #64748b; border-bottom: 1px solid #1e293b; }
        .log-table td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid #0d1117; }
        .log-success { color: #4ade80; }
        .log-failed { color: #f87171; }
        .log-error { color: #ef4444; }

        .toast-container { position: fixed; top: 60px; right: 20px; z-index: 9999; }
        .toast { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px 20px; margin-bottom: 8px; font-size: 13px; color: #e2e8f0; animation: slideIn 0.3s ease; max-width: 360px; }
        .toast.success { border-color: #22c55e; }
        .toast.error { border-color: #ef4444; }
        .toast.info { border-color: #60a5fa; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }

        @media (max-width: 768px) {
            .admin-grid { grid-template-columns: 1fr; }
            .admin-card { padding: 16px; }
            .admin-card.full-width { overflow-x: auto; }
            .cred-table { font-size: 10px; }
            .cred-table th, .cred-table td { padding: 4px 6px; white-space: nowrap; }
            .cred-update-area textarea { min-height: 40px; font-size: 11px; }
            .admin-card h3 { font-size: 14px; }
            .admin-card .form-group input, .admin-card .form-group select, .admin-card .form-group textarea { font-size: 12px; }
            #new-key-box { font-size: 11px; }
        }
        /* 开关样式 */
        .toggle-switch input:checked + .toggle-slider { background: #34d399; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }
        .toggle-slider::before { content:""; position:absolute; width:18px; height:18px; left:2px; bottom:2px; background:#e2e8f0; border-radius:50%; transition:0.3s; }

<script>
/* ====== 配置 ====== */
const NAMES = {
    tencent:'腾讯云', tencent_codingplan:'Coding Plan',
    tencent_hy_tokenplan:'Hy Token Plan', tencent_tokenplan:'Token Plan（通用）',
    volcano:'火山引擎', volcano_codingplan:'Coding Plan', volcano_ark:'火山方舟',
    volcano_balance:'火山方舟',
    xiaomi:'MIMO',
    deepseek:'DeepSeek'
};

/* 子平台 → 父平台映射 */
const SUB_TO_PARENT = {
    tencent_codingplan:'tencent', tencent_hy_tokenplan:'tencent', tencent_tokenplan:'tencent',
    volcano_codingplan:'volcano', volcano_ark:'volcano', volcano_balance:'volcano',
};

let cd = 30;
let lastDataHash = '';
window._refreshInterval = 30;

/* ====== 认证状态 ====== */
let authToken = localStorage.getItem('token') || '';
let isLoggedIn = false;
let hasPassword = false;

/* 带认证的 fetch 封装 */
async function authFetch(url, options = {}) {
    if (authToken) {
        if (!options.headers) options.headers = {};
        options.headers['Authorization'] = 'Bearer ' + authToken;
    }
    const resp = await fetch(url, options);
    if (resp.status === 401) {
        // Token 过期，清除登录状态
        clearAuth();
        toast('登录已过期，请重新登录', 'error');
        // 如果在管理页，刷新认证区域
        if (document.getElementById('page-admin').classList.contains('active')) {
            renderAuthArea();
        }
        throw new Error('未授权');
    }
    return resp;
}

/* 清除认证 */
function clearAuth() {
    authToken = '';
    isLoggedIn = false;
    localStorage.removeItem('token');
    updateAuthUI();
}

/* 更新认证相关UI */
function updateAuthUI() {
    const indicator = document.getElementById('auth-indicator');
    if (isLoggedIn) {
        indicator.style.display = 'inline';
    } else {
        indicator.style.display = 'none';
    }
    updateRefreshBtn();
}

/* 检查认证状态 */
async function checkAuthStatus() {
    try {
        const resp = await authFetch('/api/auth/status');
        const data = await resp.json();
        hasPassword = data.has_password;
        isLoggedIn = data.authenticated;
        updateAuthUI();
        return data;
    } catch(e) {
        return { has_password: false, authenticated: false };
    }
}

/* 渲染认证区域（管理页） */
function renderAuthArea() {
    const area = document.getElementById('admin-auth-area');
    const content = document.getElementById('admin-content');

    if (isLoggedIn) {
        area.innerHTML = '';
        content.style.display = 'block';
        return;
    }

    content.style.display = 'none';

    if (!hasPassword) {
        // 首次设置密码
        area.innerHTML = '<div class="auth-container"><div class="auth-card">' +
            '<div class="auth-icon">🔐</div>' +
            '<div class="auth-title">首次使用，请设置管理密码</div>' +
            '<div class="auth-desc">设置密码后，管理后台和敏感操作将需要登录</div>' +
            '<div class="form-group"><label>设置密码</label><input type="password" id="setup-password" placeholder="至少4位密码" onkeydown="if(event.key===\'Enter\')doSetup()"></div>' +
            '<div class="form-group"><label>确认密码</label><input type="password" id="setup-password2" placeholder="再次输入密码" onkeydown="if(event.key===\'Enter\')doSetup()"></div>' +
            '<div class="auth-error" id="setup-error"></div>' +
            '<button class="btn btn-primary" onclick="doSetup()">设置密码并登录</button>' +
            '</div></div>';
    } else {
        // 登录
        area.innerHTML = '<div class="auth-container"><div class="auth-card">' +
            '<div class="auth-icon">🔒</div>' +
            '<div class="auth-title">管理后台登录</div>' +
            '<div class="auth-desc">请输入管理密码以访问后台功能</div>' +
            '<div class="form-group"><label>密码</label><input type="password" id="login-password" placeholder="输入管理密码" onkeydown="if(event.key===\'Enter\')doLogin()"></div>' +
            '<div class="auth-error" id="login-error"></div>' +
            '<button class="btn btn-primary" onclick="doLogin()">登录</button>' +
            '</div></div>';
        // 自动聚焦密码框
        setTimeout(() => { const el = document.getElementById('login-password'); if (el) el.focus(); }, 100);
    }
}

/* 首次设置密码 */
async function doSetup() {
    const pw = document.getElementById('setup-password').value;
    const pw2 = document.getElementById('setup-password2').value;
    const errEl = document.getElementById('setup-error');

    if (pw.length < 4) { errEl.textContent = '密码至少4位'; return; }
    if (pw !== pw2) { errEl.textContent = '两次密码不一致'; return; }

    try {
        const resp = await fetch('/api/auth/setup', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ password: pw })
        });
        const data = await resp.json();
        if (resp.ok && data.token) {
            authToken = data.token;
            isLoggedIn = true;
            hasPassword = true;
            localStorage.setItem('token', authToken);
            updateAuthUI();
            toast('密码设置成功，已登录', 'success');
            renderAuthArea();
            loadAdminData();
        } else {
            errEl.textContent = data.detail || '设置失败';
        }
    } catch(e) {
        errEl.textContent = '请求失败';
    }
}

/* 登录 */
async function doLogin() {
    const pw = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');

    if (!pw) { errEl.textContent = '请输入密码'; return; }

    try {
        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ password: pw })
        });
        const data = await resp.json();
        if (resp.ok && data.token) {
            authToken = data.token;
            isLoggedIn = true;
            localStorage.setItem('token', authToken);
            updateAuthUI();
            toast('登录成功', 'success');
            renderAuthArea();
            loadAdminData();
        } else {
            errEl.textContent = data.detail || '登录失败';
        }
    } catch(e) {
        errEl.textContent = '请求失败';
    }
}

/* 登出 */
async function doLogout() {
    try {
        await authFetch('/api/auth/logout', { method: 'POST' });
    } catch(e) {}
    clearAuth();
    toast('已退出登录', 'info');
    if (document.getElementById('page-admin').classList.contains('active')) {
        renderAuthArea();
    }
}

/* 修改密码 */
async function changePassword() {
    const oldPw = document.getElementById('old-password').value;
    const newPw = document.getElementById('new-password').value;
    if (!oldPw || !newPw) { toast('请填写完整', 'error'); return; }
    if (newPw.length < 4) { toast('新密码至少4位', 'error'); return; }
    try {
        const resp = await authFetch('/api/auth/change-password', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ old_password: oldPw, new_password: newPw })
        });
        const data = await resp.json();
        if (resp.ok) {
            toast('密码已修改', 'success');
            document.getElementById('old-password').value = '';
            document.getElementById('new-password').value = '';
        } else {
            toast(data.detail || '修改失败', 'error');
        }
    } catch(e) {
        if (e.message !== '未授权') toast('请求失败', 'error');
    }
}

/* ====== 密码框显示/隐藏 ====== */
function togglePW(id,btn) {
    const inp = document.getElementById(id);
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent='🙈'; }
    else { inp.type = 'password'; btn.textContent='👁️'; }
}

/* ====== 页面切换 ====== */
/*  ====== 顶栏刷新按钮（仅登录用户可见） ====== */
function updateRefreshBtn() {
    document.getElementById('refresh-btn-wrap').style.display = isLoggedIn && document.getElementById('page-monitor').classList.contains('active') ? '' : 'none';
}

async function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btns button').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('btn-' + page).classList.add('active');
    updateRefreshBtn();
    if (page === 'admin') {
        await checkAuthStatus();
        renderAuthArea();
        if (isLoggedIn) loadAdminData();
    }
}

/* ====== Toast ====== */
function toast(msg, type='info') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

/* ====== 保存凭证后立即检查+采集 ====== */
async function checkAndRefreshAfterSave(platform) {
    const platformName = NAMES[platform] || platform;
    toast('⏳ 正在刷新 ' + platformName + ' 数据...', 'info');
    try {
        // 直接刷新采集，不检查凭证（避免检查失败中断流程）
        const refreshResp = await authFetch('/api/admin/refresh/' + platform, {method:'POST'});
        const refreshResult = await refreshResp.json();
        if (refreshResult.status === 'ok') {
            toast('✅ ' + platformName + ' 数据已更新', 'success');
        } else {
            toast('⚠️ ' + platformName + ' 刷新失败', 'error');
        }
    } catch(e) {}
    // 强制刷新前端显示（更新cookie状态、卡片数据）
    lastDataHash = '';
    load();
}

/* ====== 颜色规则 ====== */
function getColorClass(pct) {
    if (pct >= 80) return { fill: 'fill-red', text: 'red' };
    if (pct >= 50) return { fill: 'fill-yellow', text: 'yellow' };
    return { fill: 'fill-green', text: 'green' };
}
function getStatusBadge(usedPct) {
    if (usedPct >= 100) return { cls: 'badge-exhausted', text: '额度已用尽' };
    if (usedPct >= 80)  return { cls: 'badge-warning', text: '额度紧张' };
    return { cls: 'badge-available', text: '可用' };
}
function fmt(n) {
    if (!n) return '0';
    if (n >= 1e8) return (n/1e8).toFixed(1) + ' 亿';
    if (n >= 1e4) return (n/1e4).toFixed(1) + ' 万';
    if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return n.toLocaleString();
}

/* ====== 监控页 ====== */

async function load() {
    try {
        const [stats, cookieSt] = await Promise.all([
            fetch('/api/stats').then(r=>r.json()).catch(()=>{return {platforms:[],version:''}}),
            fetch('/api/cookie-status').then(r=>r.json()).catch(()=>[]),
        ]);
        // 从 API 同步版本号
        if (stats.version && stats.version !== APP_VERSION) {
            document.getElementById('version-tag').textContent = stats.version;
        }
        // 数据哈希对比：数据没变不重渲染，避免排序跳动
        const newHash = JSON.stringify(stats.platforms.map(p => ({
            p: p.platform, lu: p.last_updated, nt: p.total_tokens, b: p.balance,
            c: p.monthly_cost, nu: (p.model_usages||[]).map(m => m.model + m.response)
        })));
        if (newHash !== lastDataHash) {
            lastDataHash = newHash;
            renderPlatforms(stats.platforms || []);
        }
        renderCookieAlert(cookieSt);
        document.getElementById('status').textContent = '已连接';
        lastRefreshTime = Date.now();
        if (stats.refresh_interval) {
            window._refreshInterval = Math.max(10, stats.refresh_interval);
        }
        if (document.getElementById('page-admin').classList.contains('active')) {
            loadRefreshLog();
        }
    } catch(e) {
        document.getElementById('status').textContent = '连接失败';
    }
}

/* ====== Cookie 失效警告 ====== */
function renderCookieAlert(statusList) {
    const container = document.getElementById('cookie-alert-container');
    if (!statusList || !statusList.length) { container.innerHTML = ''; return; }

    const failed = statusList.filter(s => !s.healthy);
    if (!failed.length) { container.innerHTML = ''; return; }

    // 把子平台聚合到父平台，统一视为 Cookie 过期
    const platformGroups = {};
    failed.forEach(s => {
        const parent = SUB_TO_PARENT[s.platform] || s.platform;
        if (!platformGroups[parent]) platformGroups[parent] = [];
    });

    const names = Object.keys(platformGroups).map(p => escHtml(NAMES[p] || p) + '平台');
    const text = names.join('、') + ' Cookie 已过期！';

    container.innerHTML = '<div class="cookie-alert expired">⚠️ ' + text + '</div>';
}

function renderNoDataCard(p) {
    const name = NAMES[p.platform] || p.platform;
    const ico = brandIcon(p.platform, 20) || '📊';
    return '<div class="plan-card" style="grid-column: 1 / -1"><div class="card-header"><div><div class="title" style="font-size:22px">' + ico + ' ' + escHtml(name) + '</div><div class="subtitle">凭证已保存</div></div><span class="status-badge badge-warning">无数据</span></div><div style="padding:32px;text-align:center;color:#64748b"><div style="font-size:16px;margin-bottom:8px">⏳ 等待数据采集</div><div style="font-size:13px;color:#4b5563">凭证已保存，但尚未成功采集到数据。<br>可能是 Cookie 已失效，请在管理页更新凭证后刷新。</div></div><div class="card-footer"><span>' + escHtml(name) + '</span><span>-</span></div></div>';
}

function renderPlatforms(platforms) {
    // 权重模式：从 localStorage 读取拖动顺序覆盖后端排序
    const saved = JSON.parse(localStorage.getItem('platform_order') || '[]');
    const sortModeToggle = document.getElementById('sort_mode-toggle');
    const isWeight = sortModeToggle && !sortModeToggle.checked;
    if (isWeight && saved.length) {
        const savedSet = new Set(saved);
        // 先把有记录的平台按拖动顺序排
        const ordered = [];
        const extra = [];
        for (const p of saved) {
            const found = platforms.find(x => x.platform === p);
            if (found) ordered.push(found);
        }
        // 新增平台（拖动后新加的凭证）排在最后
        for (const p of platforms) {
            if (!savedSet.has(p.platform)) extra.push(p);
        }
        platforms = [...ordered, ...extra];
    }
    
    const el = document.getElementById('platforms');
    if (!platforms.length) {
        el.innerHTML = '<div class="empty-state"><div class="icon">📊</div><div class="msg">暂无平台数据</div><div class="hint">前往 ⚙️管理 添加凭证并刷新数据</div></div>';
        return;
    }
    el.innerHTML = platforms.map(p => {
        if (p.no_data) return renderNoDataCard(p);
        if (p.platform === 'tencent' && p.services) return renderTencentCard(p);
        if (p.platform === 'volcano' && p.services) return renderVolcanoGroupCard(p);
        if (p.platform === 'xiaomi') return renderXiaomiCard(p);
        if (p.quotas) return renderCodingPlan(p);
        if (p.remaining_pct !== undefined) return renderTokenPlan(p);
        return renderFallback(p);
    }).join('');
}

/* ====== 火山引擎大卡 ====== */
function renderVolcanoGroupCard(p) {
    const services = p.services || [];
    const visibleServices = services.filter(s => {
        if (s.balance_available !== undefined && s.balance_available <= 0 && !s.quotas && s.remaining_pct === undefined) return false;
        return true;
    });
    let worstPct = 0, hasExhausted = false;
    visibleServices.forEach(s => {
        let usedPct = 0;
        if (s.quotas) usedPct = Math.max(...Object.values(s.quotas).map(q => q.used_pct || 0));
        else if (s.remaining_pct !== undefined) usedPct = 100 - s.remaining_pct;
        if (usedPct >= 100) hasExhausted = true;
        worstPct = Math.max(worstPct, usedPct);
    });
    const anyExhausted = visibleServices.some(s => {
        if (s.remaining_pct !== undefined && s.remaining_pct <= 0) return true;
        if (s.quotas) return Object.values(s.quotas).some(q => q.used_pct >= 100);
        return false;
    });
    const badge = getStatusBadge(anyExhausted ? 100 : worstPct);

    let servicesHtml = visibleServices.map(s => {
        let subName = NAMES[s.platform] || s.platform;
        if (s.platform === 'volcano' && s.balance_available !== undefined) subName = '火山方舟';
        if (s.quotas) return renderSubCodingPlan(s, subName);
        if (s.remaining_pct !== undefined) return renderSubTokenPlan(s, subName);
        if (s.balance_available !== undefined) return renderVolcanoBalanceSub(s, subName);
        return '<div class="sub-service"><div class="sub-header">' + subName + '</div><div style="padding:12px;color:#4b5563">数据格式异常</div></div>';
    }).join('');

    return '<div class="plan-card" style="grid-column: 1 / -1"><div class="card-header"><div><div class="title" style="font-size:22px">' + brandIcon('volcano', 20) + '火山引擎</div><div class="subtitle">' + visibleServices.length + ' 个服务 · 北京区域</div></div><span class="status-badge ' + badge.cls + '">' + badge.text + '</span></div><div style="padding:0">' + servicesHtml + '</div><div class="card-footer"><span>火山引擎 · ' + visibleServices.length + ' 个服务</span><span>' + (p.last_updated ? new Date(p.last_updated).toLocaleTimeString() : '-') + '</span></div></div>';
}

/* 子服务: 火山余额 */
function renderVolcanoBalanceSub(s, name) {
    const available = s.balance_available || 0;
    const cash = s.balance_cash || 0;
    const credit = s.balance_credit || 0;
    const frozen = s.balance_frozen || 0;
    const arrears = s.balance_arrears || 0;
    const isLow = available < 10;
    const isExhausted = available <= 0 || arrears > 0;
    const badge = isExhausted ? getStatusBadge(100) : isLow ? getStatusBadge(70) : getStatusBadge(30);
    const c = getColorClass(isExhausted ? 100 : isLow ? 70 : 30);

    let balanceHtml = '<div style="display:flex;align-items:baseline;gap:12px;padding:16px 24px">' +
        '<span style="font-size:13px;color:#64748b">可用余额</span>' +
        '<span style="font-size:28px;font-weight:800" class="' + c.text + '">¥' + available.toFixed(2) + '</span>' +
        '<span style="font-size:12px;color:#94a3b8">现金 ¥' + cash.toFixed(2) +
        (credit > 0 ? ' · 信控 ¥' + credit.toFixed(2) : '') +
        (frozen > 0 ? ' · 冻结 ¥' + frozen.toFixed(2) : '') +
        (arrears > 0 ? ' · <span style="color:#ef4444">欠费 ¥' + arrears.toFixed(2) + '</span>' : '') +

}

/* ====== 腾讯大卡 ====== */
function renderTencentCard(p) {
    const services = p.services || [];
    let worstPct = 0, hasExhausted = false;
    services.forEach(s => {
        let usedPct = 0;
        if (s.quotas) usedPct = Math.max(...Object.values(s.quotas).map(q => q.used_pct || 0));
        else if (s.remaining_pct !== undefined) usedPct = 100 - s.remaining_pct;
        if (usedPct >= 100) hasExhausted = true;
        worstPct = Math.max(worstPct, usedPct);
    });
    const anyExhausted = services.some(s => s.remaining_pct !== undefined && s.remaining_pct <= 0);

        const subName = NAMES[s.platform] || s.platform;

}

/* 子服务: Coding Plan */
function renderSubCodingPlan(s, name) {
    const q = s.quotas || {};
    const quotaLabels = { '5h': {name:'每5小时',icon:'⚡'}, 'weekly': {name:'每周',icon:'📅'}, 'monthly': {name:'每订阅月',icon:'📆'} };
    const anyExhausted = Object.values(q).some(v => v.used_pct >= 100);
    const worstPct = Math.max(...Object.values(q).map(v => v.used_pct || 0));
    const badge = anyExhausted ? getStatusBadge(100) : getStatusBadge(worstPct);

    let recoveryTime = '';
    for (const [key, info] of Object.entries(q)) {
        if (info.used_pct >= 100 && info.refresh_at && (!recoveryTime || info.refresh_at < recoveryTime)) {
            recoveryTime = info.refresh_at;
        }
    }

    let quotaHtml = '';
    for (const [key, info] of Object.entries(q)) {
        const label = quotaLabels[key] || {name:key,icon:'📊'};
        const pct = info.used_pct || 0;
        const hasTotal = info.total > 0;
        const remaining = hasTotal ? (info.total - Math.round(info.total * pct / 100)) : 0;
        const c = getColorClass(pct);
        const isBlocked = pct >= 100;
        const totalHint = hasTotal ? '<span class="quota-total-hint">(总量 ' + info.total.toLocaleString() + ')</span>' : '';
        const remainingText = hasTotal ? '剩余 ' + remaining.toLocaleString() : (100-pct).toFixed(1) + '% 可用';
        quotaHtml += '<div class="quota-item"><div class="quota-top"><span class="quota-label">' + label.icon + ' ' + label.name + ' ' + totalHint + (isBlocked ? '<span style="color:#f87171;font-size:12px;font-weight:700">⛔ 已用尽</span>' : '') + '</span><span class="quota-remaining ' + c.text + '">' + remainingText + '</span></div><div class="progress-track"><div class="progress-fill ' + c.fill + '" style="width:' + Math.min(pct,100) + '%"></div></div><div class="quota-footer"><span class="quota-pct ' + c.text + '">' + pct.toFixed(1) + '% 已用</span><span class="quota-refresh">' + (isBlocked ? '🔄 ' + (info.refresh_at || '') + ' 恢复' : '🔄 ' + (info.refresh_at || '') + ' 刷新') + '</span></div></div>';
    }

    const overlayHtml = anyExhausted && recoveryTime
        ? '<div class="sub-exhausted-overlay"><div class="exhausted-text">额度已用尽</div><div class="exhausted-recovery"><span>恢复时间</span><span class="time">' + recoveryTime + '</span><span class="countdown" data-recovery="' + recoveryTime + '">计算中...</span></div></div>'
        : '';

    return '<div class="sub-service"><div class="sub-header"><span>' + name + '</span><span style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#64748b">' + (s.plan_type||'Lite') + ' · ' + (s.cost?s.cost+'元/月':'') + '</span><span class="status-badge ' + badge.cls + '" style="font-size:11px;padding:2px 8px">' + badge.text + '</span></span></div><div class="quota-body" style="position:relative">' + quotaHtml + overlayHtml + '</div></div>';
}

function updateCountdowns() {
    document.querySelectorAll('.countdown[data-recovery]').forEach(el => {
        const recovery = new Date(el.dataset.recovery);
        if (isNaN(recovery)) { el.textContent = ''; return; }
        const diff = recovery - new Date();
        if (diff <= 0) { el.textContent = '已到刷新时间'; return; }
        const d = Math.floor(diff / 86400000), h = Math.floor((diff % 86400000) / 3600000), m = Math.floor((diff % 3600000) / 60000);
        el.textContent = '还剩 ' + d + '天 ' + h + '小时 ' + m + '分钟';
    });
}

let platformConfigs = {};

async function loadAdminData() {
    if (!isLoggedIn) return;
    try {
        await Promise.all([loadCredentials(), loadSchedulerStatus(), loadRefreshLog(), loadPlatformConfigs(), loadSortWeights(), loadSortMode(), loadApiKeys()]);

async function loadPlatformConfigs() {
    try {
        const resp = await authFetch('/api/admin/platforms');
        platformConfigs = await resp.json();
        const select = document.getElementById('cred-platform');
        if (select.options.length <= 1) {
            for (const [key, cfg] of Object.entries(platformConfigs)) {
                const opt = document.createElement('option');
                opt.value = key; opt.textContent = cfg.name;
                select.appendChild(opt);
            }
        }
    } catch(e) { console.error(e); }
}

function onPlatformChange() {
    const platform = document.getElementById('cred-platform').value;
    const hint = document.getElementById('cred-hint');
    const typeSelect = document.getElementById('cred-type');
    const dataTextarea = document.getElementById('cred-data');
    if (platform && platformConfigs[platform]) {
        const cfg = platformConfigs[platform];
        typeSelect.innerHTML = '';
        cfg.credential_types.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            if (t === 'cookie') { opt.textContent = 'Cookie'; hint.textContent = cfg.cookie_hint; dataTextarea.placeholder = '粘贴完整的 Cookie 字符串...'; }
            else { opt.textContent = 'API Key'; hint.textContent = cfg.api_key_hint; dataTextarea.placeholder = '粘贴 API Key 或 JSON...'; }
            typeSelect.appendChild(opt);
        });
    }
}

async function loadSortWeights() {
    try {
        const [credsResp] = await Promise.all([
            authFetch('/api/admin/credentials').then(r=>r.json())
        ]);
        const container = document.getElementById('sort-weight-list');
        if (!container) return;
        
        const activePlatforms = [...new Set(credsResp.map(c => c.platform))];
        if (!activePlatforms.length) {
            container.innerHTML = '<span style="font-size:12px;color:#4b5563">暂无有效平台</span>';
            return;
        }
        
        // 从 localStorage 读保存的顺序，没有则用原来的
        const saved = JSON.parse(localStorage.getItem('platform_order') || '[]');
        const ordered = saved.filter(p => activePlatforms.includes(p));
        for (const p of activePlatforms) {
            if (!ordered.includes(p)) ordered.push(p);
        }
        
        container.innerHTML = ordered.map(p => {
            const name = NAMES[p] || p;
            const icon = {deepseek:'🔮',xiaomi:'🧸',tencent:'🔷',volcano:'🌋'}[p] || '📊';
            return '<div draggable="true" data-platform="' + p + '" id="drag-' + p + '" ' +
                'style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d1117;border:1px solid #1e293b;border-radius:8px;cursor:grab;user-select:none;-webkit-user-select:none;font-size:13px;color:#e2e8f0">' +
                '<span style="font-size:16px;line-height:1;cursor:grab">⠿</span>' +
                '<span>' + icon + '</span>' +
                '<span style="flex:1">' + name + '</span>' +
                '</div>';
        }).join('');
        
        // 绑定事件：桌面拖拽 + 移动端触控
        container.querySelectorAll('[draggable]').forEach(el => {
            el.addEventListener('dragstart', onDragStart);
            el.addEventListener('dragend', onDragEnd);
            el.addEventListener('dragover', onDragOver);
            el.addEventListener('drop', onDrop);
            // 移动端触控
            el.addEventListener('touchstart', onTouchStart, {passive:false});
            el.addEventListener('touchmove', onTouchMove, {passive:false});
            el.addEventListener('touchend', onTouchEnd, {passive:false});
        });
        container.addEventListener('dragover', e => e.preventDefault());
    } catch(e) { console.error(e); }
}

/* ====== 拖动排序核心逻辑 ====== */
let _dragSrc = null;
function onDragStart(e) {
    _dragSrc = this;
    this.style.opacity = '0.4';
    this.style.background = '#1e293b';
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', this.dataset.platform);
}
function onDragOver(e) {
    if (e.preventDefault) e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    return false;
}
function onDragEnd(e) {
    this.style.opacity = '';
    this.style.background = '';
    _dragSrc = null;
    // 清理所有高亮
    document.querySelectorAll('#sort-weight-list > div').forEach(d => {
        d.style.borderTop = ''; d.style.borderBottom = '';
    });
}
function onDrop(e) {
    e.stopPropagation();
    e.preventDefault();
    if (!_dragSrc || _dragSrc === this) return;
    const container = document.getElementById('sort-weight-list');
    const items = [...container.children];
    const fromIdx = items.indexOf(_dragSrc);
    const toIdx = items.indexOf(this);
    if (fromIdx < toIdx) {
        this.parentNode.insertBefore(_dragSrc, this.nextSibling);
    } else {
        this.parentNode.insertBefore(_dragSrc, this);
    }
    // 保存顺序
    _saveSortOrder();
    onDragEnd.call(_dragSrc);
}
function _saveSortOrder() {

    const order = [...container.children].map(el => el.dataset.platform);
    localStorage.setItem('platform_order', JSON.stringify(order));
    toast('排序已保存', 'success');
}

/* ====== 实时排序开关 ====== */
async function loadSortMode() {
    try {
        const resp = await authFetch('/api/admin/sort_mode');
        const data = await resp.json();
        const toggle = document.getElementById('sort_mode-toggle');
        const label = document.getElementById('sort_mode-label');

}
async function toggleSortMode() {
    const toggle = document.getElementById('sort_mode-toggle');
    const label = document.getElementById('sort_mode-label');
    const mode = toggle.checked ? 'realtime' : 'weight';
    try {
        const resp = await authFetch('/api/admin/sort_mode', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({mode})
        });
        const result = await resp.json();
        if (result.status === 'ok') {
            label.textContent = mode === 'realtime' ? '实时排序' : '权重排序';
            toast(result.message, 'success');
            lastDataHash = '';
            load();
        } else {
            toast(result.error || '保存失败', 'error');
            toggle.checked = !toggle.checked;
        }
    } catch(e) { if (e.message !== '未授权') toast('请求失败: '+e.message, 'error'); }
}

/* ====== 移动端触控拖动 ====== */
let _touchSrc = null, _touchClone = null, _touchY = 0, _touchStartY = 0;
function onTouchStart(e) {
    _touchSrc = this;
    _touchStartY = e.touches[0].clientY;
    _touchY = e.touches[0].clientY;
    this.style.opacity = '0.4';
    this.style.background = '#1e293b';
}
function onTouchMove(e) {
    e.preventDefault();
    if (!_touchSrc) return;
    _touchY = e.touches[0].clientY;
    const container = document.getElementById('sort-weight-list');
    const items = [...container.children];
    // 找到手指位置的元素
    for (const item of items) {
        if (item === _touchSrc) continue;
        const rect = item.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (_touchY < mid) {
            container.insertBefore(_touchSrc, item);
            return;
        }
    }
    container.appendChild(_touchSrc);
}
function onTouchEnd(e) {
    if (!_touchSrc) return;
    _touchSrc.style.opacity = '';
    _touchSrc.style.background = '';
    _saveSortOrder();
    _touchSrc = null;
}

async function loadCredentials() {
    try {
        const resp = await authFetch('/api/admin/credentials');
        const creds = await resp.json();
        const tbody = document.getElementById('cred-tbody');
        if (!creds.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#4b5563">暂无凭证，请添加</td></tr>'; return; }
        tbody.innerHTML = creds.map(c => {
            const p = escJs(c.platform);
            return '<tr id="cred-row-'+p+'">' +
                '<td><strong>'+escHtml(NAMES[c.platform]||c.platform)+'</strong></td>' +
                '<td><span class="cred-type-badge type-'+escHtml(c.credential_type)+'">'+(c.credential_type==='cookie'?'🍪 Cookie':'🔑 API Key')+'</span></td>' +
                '<td>'+escHtml(c.note||'-')+'</td>' +
                '<td>'+escHtml(c.updated_at||'-')+'</td>' +
                '<td><div class="cred-actions">' +
                    '<button class="btn btn-outline" onclick="checkCredential(\''+p+'\')">🔍 检查</button>' +
                    '<button class="btn btn-primary" onclick="showUpdateCred(\''+p+'\',\''+escJs(c.credential_type)+'\')">✏️ 更新</button>' +
                    '<button class="btn btn-danger" onclick="deleteCredential(\''+p+'\')">🗑️</button>' +
                '</div>' +
                '<div id="check-result-'+p+'"></div>' +
                '<div id="update-area-'+p+'" class="cred-update-area">' +
                    '<textarea id="update-data-'+p+'" placeholder="粘贴新的 Cookie 或凭证数据..."></textarea>' +
                    '<button class="btn btn-primary" onclick="doUpdateCred(\''+p+'\',\''+escJs(c.credential_type)+'\')">💾 保存</button>' +
                    '<button class="btn btn-outline" onclick="hideUpdateCred(\''+p+'\')">取消</button>' +
                '</div></td>' +
            '</tr>';
        }).join('');
    } catch(e) { console.error(e); }
}

async function saveCredential() {
    const platform = document.getElementById('cred-platform').value;
    const cred_type = document.getElementById('cred-type').value;
    const cred_data = document.getElementById('cred-data').value.trim();
    const note = document.getElementById('cred-note').value.trim();
    if (!platform) { toast('请选择平台', 'error'); return; }
    if (!cred_data) { toast('请输入凭证数据', 'error'); return; }
    try {
        const resp = await authFetch('/api/admin/credentials', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({platform, credential_type: cred_type, credential_data: cred_data, note}) });
        const result = await resp.json();
        if (result.status === 'ok') {
            toast(result.message, 'success');
            document.getElementById('cred-data').value='';
            document.getElementById('cred-note').value='';
            loadCredentials();
            // 保存成功后立即检查凭证并采集数据
            await checkAndRefreshAfterSave(platform);
        }
        else { toast(result.error || '保存失败', 'error'); }
    } catch(e) { if (e.message !== '未授权') toast('请求失败: '+e.message, 'error'); }
}

async function deleteCredential(platform) {
    if (!confirm('确定删除 '+(NAMES[platform]||platform)+' 的凭证？')) return;
    try {
        const resp = await authFetch('/api/admin/credentials/'+platform, {method:'DELETE'});
        const result = await resp.json();
        if (result.status==='ok') {
            toast('已删除', 'success');
            loadCredentials();
            // 删除后立即刷新该平台数据，清空前台显示
            await checkAndRefreshAfterSave(platform);
        }
        else { toast(result.error||'删除失败', 'error'); }
    } catch(e) { if (e.message !== '未授权') toast('请求失败', 'error'); }
}

async function checkCredential(platform) {
    const resultEl = document.getElementById('check-result-'+platform);
    resultEl.innerHTML = '<span class="cred-check-loading">⏳ 检查中...</span>';
    try {
        const resp = await authFetch('/api/admin/check-credential/'+platform, {method:'POST', body:'{}'});
        const result = await resp.json();
        if (result.error && !result.details) {
            resultEl.innerHTML = '<div class="cred-check-result cred-check-fail">❌ '+escHtml(result.error)+'</div>';
            return;
        }
        const allOk = result.status === 'ok';
        let html = '<div class="cred-check-result '+(allOk?'cred-check-ok':'cred-check-fail')+'">';
        html += allOk ? '✅ 凭证有效' : '❌ 凭证异常';
        if (result.duration_ms) html += ' <span style="opacity:0.7">('+result.duration_ms+'ms)</span>';
        if (result.details) {
            result.details.forEach(d => {
                const name = NAMES[d.platform] || d.platform;
                if (d.status === 'ok') {
                    html += '<div style="margin-top:2px">✅ '+escHtml(name)+': '+escHtml(d.remaining||'正常')+'</div>';
                } else {
                    html += '<div style="margin-top:2px">❌ '+escHtml(name)+': '+escHtml(d.error||'失败');
                    if (d.cookie_expired) html += ' 🍪已失效';
                    html += '</div>';
                }
            });
        }
        html += '</div>';
        resultEl.innerHTML = html;
    } catch(e) {
        resultEl.innerHTML = '<div class="cred-check-result cred-check-fail">❌ 请求失败: '+escHtml(e.message)+'</div>';
    }
}

function showUpdateCred(platform, credType) {
    const area = document.getElementById('update-area-'+platform);
    const textarea = document.getElementById('update-data-'+platform);
    if (area) {
        area.classList.add('active');
        // 设置placeholder提示
        if (platformConfigs[platform]) {
            const cfg = platformConfigs[platform];
            textarea.placeholder = credType === 'cookie'
                ? (cfg.cookie_hint || '粘贴新的 Cookie...')
                : (cfg.api_key_hint || '粘贴新的 API Key...');
        }
        textarea.focus();
    }
}

function hideUpdateCred(platform) {
    const area = document.getElementById('update-area-'+platform);
    if (area) {
        area.classList.remove('active');
        document.getElementById('update-data-'+platform).value = '';
    }
}

async function doUpdateCred(platform, credType) {
    const data = document.getElementById('update-data-'+platform).value.trim();
    if (!data) { toast('请输入凭证数据', 'error'); return; }
    try {
        const resp = await authFetch('/api/admin/credentials', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({platform, credential_type: credType, credential_data: data})
        });
        const result = await resp.json();
        if (result.status === 'ok') {
            toast((NAMES[platform]||platform)+' 凭证已更新', 'success');
            hideUpdateCred(platform);
            loadCredentials();
            // 更新成功后立即检查凭证并采集数据
            await checkAndRefreshAfterSave(platform);
        } else {
            toast(result.error || '更新失败', 'error');
        }
    } catch(e) {
        if (e.message !== '未授权') toast('请求失败: '+e.message, 'error');
    }
}

// ============ API 密钥管理（TOTP） ============
async function loadApiKeys() {
    const el = document.getElementById('api-key-list');
    if (!el) return;
    try {
        const resp = await authFetch('/api/admin/api_keys');
        const keys = await resp.json();
        const active = keys.filter(function(k) { return !k.revoked; });
        if (!active.length) { el.innerHTML = '<div style="color:#64748b;padding:6px 0">暂无密钥</div>'; return; }
        el.innerHTML = active.map(function(k) {
            return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1e293b">' +
                '<span>'+escHtml(k.name)+'</span>' +
                '<span style="font-size:11px;color:#64748b">🟢 有效</span>' +
                '<span style="font-size:11px;color:#64748b;margin-left:auto">'+escHtml(k.created_at_fmt||'')+'</span>' +
                '<button class="btn btn-danger" style="font-size:11px;padding:2px 8px;margin-left:8px" onclick="revokeApiKey('+k.id+')">吊销</button>' +
                '</div>';
        }).join('');
    } catch(e) {
        el.innerHTML = '<div style="color:#ef4444;padding:6px 0">加载失败</div>';
    }
}

async function createApiKey() {
    var name = document.getElementById('api-key-name').value.trim() || 'Chrome Extension';
    try {
        var resp = await authFetch('/api/admin/api_keys', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name}) });
        var data = await resp.json();
        if (data.id) {
            toast('密钥已生成', 'success');
            var keyStr = data.name+'|'+data.secret;
            window._lastKeyStr = keyStr;

            var keyList = document.getElementById('api-key-list');
            var greenHtml =
                '<div id="new-key-box" style="background:#064e3b;border:1px solid #059669;border-radius:8px;padding:12px;margin-bottom:8px">' +
                '<div style="font-size:11px;color:#6ee7b7;margin-bottom:4px">⚠️ 关闭后无法再次查看，请立即复制到插件</div>' +
                '<div style="background:#0f172a;color:#4ade80;padding:8px 12px;border-radius:6px;font-family:monospace;font-size:13px;word-break:break-all;user-select:all">'+escHtml(keyStr)+'</div>' +
                '<div style="margin-top:8px"><button class="btn btn-primary" onclick="copyApiKey()">📋 复制到剪贴板</button></div>' +
                '</div>';

            // 清除旧绿色框，插入新绿色框到最顶部
            var oldBox = document.getElementById('new-key-box');
            if (oldBox) oldBox.remove();
            var temp = document.createElement('div');
            temp.innerHTML = greenHtml;
            keyList.prepend(temp.firstElementChild);
        } else {
            toast(data.detail || '生成失败', 'error');
        }
    } catch(e) {
        toast('请求失败', 'error');
    }
}

function copyApiKey() {
    if (window._lastKeyStr) {
        navigator.clipboard.writeText(window._lastKeyStr);
        toast('密钥已复制到剪贴板', 'success');
        // 复制后自动关闭绿色提示框
        var box = document.getElementById('new-key-box');
        if (box) {
            box.style.transition = 'opacity 0.3s';
            box.style.opacity = '0';
            setTimeout(function() { if (box && box.parentNode) box.parentNode.removeChild(box); }, 300);
        }
    }
}

async function revokeApiKey(id) {
    if (!confirm('确定吊销此密钥？')) return;
    try {
        var resp = await authFetch('/api/admin/api_keys/'+id, { method:'DELETE' });
        var data = await resp.json();
        if (data.status==='ok') { toast('已吊销', 'success'); loadApiKeys(); }
        else { toast(data.detail||'吊销失败', 'error'); }
    } catch(e) { toast('请求失败', 'error'); }
}

async function loadSchedulerStatus() {
    try {
        const resp = await authFetch('/api/admin/scheduler');
        const data = await resp.json();
        const dot = document.getElementById('scheduler-dot'), label = document.getElementById('scheduler-label');
        if (data.running) { dot.className='status-dot-admin dot-running'; label.textContent='运行中'; label.style.color='#4ade80'; }
        else { dot.className='status-dot-admin dot-stopped'; label.textContent='已停止'; label.style.color='#6b7280'; }
        document.getElementById('scheduler-interval-label').textContent = '间隔: ' + data.interval + '秒';
    } catch(e) { console.error(e); }
}

async function schedulerAction(action) {
    try {
        const resp = await authFetch('/api/admin/scheduler', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action})});
        const result = await resp.json();
        toast(result.message, result.status==='ok'?'success':'info');
        loadSchedulerStatus();
    } catch(e) { if (e.message !== '未授权') toast('请求失败', 'error'); }
}

async function updateInterval() {
    const interval = parseInt(document.getElementById('interval-input').value);
    if (interval < 10 || interval > 120) { toast('间隔范围10~120秒', 'error'); return; }
    try {
        await authFetch('/api/admin/scheduler', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({interval})});
        toast('间隔已更新', 'success'); loadSchedulerStatus();
    } catch(e) { if (e.message !== '未授权') toast('请求失败', 'error'); }
}

async function refreshNow() {
    const ico = document.getElementById('refresh-icon');
    if (ico) { ico.style.transition = 'transform 0.6s'; ico.style.transform = 'rotate(360deg)'; }
    toast('正在刷新所有平台...', 'info');
    try {
        const resp = await authFetch('/api/admin/refresh', {method:'POST'});
        const result = await resp.json();
        if (result.status==='ok') {
            const results = result.results||{};
            const summary = Object.entries(results).map(([k,v])=>(NAMES[k]||k)+': '+(v.status==='success'?'✅':'❌ '+(v.error||''))).join('\n');
            toast('刷新完成:\n'+summary, 'success');
            loadRefreshLog(); load();
        }
    } catch(e) { if (e.message !== '未授权') toast('刷新失败: '+e.message, 'error'); }
    if (ico) setTimeout(() => { ico.style.transition = 'none'; ico.style.transform = 'rotate(0deg)'; }, 800);
}

async function loadRefreshLog() {
    try {
        const resp = await authFetch('/api/admin/refresh-log?limit=20');
        const logs = await resp.json();
        const tbody = document.getElementById('log-tbody');
        if (!logs.length) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#4b5563">暂无刷新记录</td></tr>'; return; }
        tbody.innerHTML = logs.map(l => '<tr><td>'+escHtml(l.timestamp_fmt||'-')+'</td><td>'+escHtml(NAMES[l.platform]||l.platform)+'</td><td class="log-'+escHtml(l.status)+'">'+(l.status==='success'?'✅ 成功':l.status==='failed'?'❌ 失败':'⚠️ 错误')+'</td><td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+escHtml(l.message||'')+'">'+escHtml(l.message||'-')+'</td><td>'+(l.duration_ms?l.duration_ms+'ms':'-')+'</td></tr>').join('');
    } catch(e) { console.error(e); }
}

/* ====== 初始化 ====== */
document.getElementById('version-tag').textContent = APP_VERSION;

// 启动时检查认证状态
checkAuthStatus().then(() => {
    // 根据登录状态渲染监控页的隐藏按钮
    lastDataHash = ''; // 强制重新渲染
});

load();
// 自动刷新：每1秒检查一次
let lastRefreshTime = Date.now();
;(async function startAutoRefresh() {
    setInterval(async () => {
        const iv = window._refreshInterval || 30;
        const elapsed = Math.floor((Date.now() - lastRefreshTime) / 1000);
        const remain = Math.max(0, iv - elapsed);
        const cdEl = document.getElementById('cd');
        cdEl.textContent = remain;
        // 颜色: 绿色(>15s) → 黄色(>5s) → 红色(≤5s)
        cdEl.style.color = remain > 15 ? '#4ade80' : remain > 5 ? '#fbbf24' : '#ef4444';
        
        if (remain <= 0) {
            const oldHash = lastDataHash;
            await load();
            lastRefreshTime = Date.now();
            if (lastDataHash !== oldHash) toast('数据已刷新', 'info');
        }
    }, 1000);
})();
setInterval(updateCountdowns, 60000);

// 定期检查认证状态（5分钟），防止 token 过期后 UI 不一致
setInterval(async () => {
    const status = await checkAuthStatus();
    if (!status.authenticated && document.getElementById('page-admin').classList.contains('active')) {
        renderAuthArea();
    }
}, 300000);
