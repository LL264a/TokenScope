<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Token 监控面板</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='10.5' y='1' width='3' height='14' rx='1.5' fill='%2360a5fa'/%3E%3Crect x='3.5' y='3.5' width='17' height='3' rx='1.5' fill='%23c084fc'/%3E%3Ccircle cx='12' cy='12' r='7' stroke='%234ade80' stroke-width='1.5' fill='none'/%3E%3Ctext x='12' y='15' text-anchor='middle' font-family='system-ui,sans-serif' font-size='9' font-weight='700' fill='%234ade80'%3ET%3C/text%3E%3C/svg%3E">
    <script>/* 版本号 */ const APP_VERSION = 'v1.9.4';</script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        /* ====== 顶栏 ====== */
        .top-bar {
            background: linear-gradient(135deg, #1a1f35, #0f172a);
            border-bottom: 1px solid #1e293b;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 {
            font-size: 20px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            line-height: 1.3;
        }
        .top-bar h1 #version-tag { display: block; font-size: 11px; color: #4ade80; -webkit-text-fill-color: #4ade80; }
        .top-bar .meta {
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .top-bar .nav-btns { display: flex; gap: 8px; }
        .top-bar .nav-btns button {
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #1e293b;
            background: #111827;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .top-bar .nav-btns button:hover { border-color: #60a5fa; color: #60a5fa; }
        .top-bar .nav-btns button.active { background: #1e3a5f; border-color: #60a5fa; color: #60a5fa; }
        .live-dot {
            width: 6px; height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: blink 2s infinite;
            display: inline-block;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

        .container { max-width: 1600px; margin: 0 auto; padding: 24px; }

        /* ====== 移动端适配 ====== */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .platform-grid { gap: 12px; }
            .platform-grid > .plan-card { flex: 1 1 100%; min-width: 0; }
            .plan-card { border-radius: 12px; }
            .card-header { padding: 14px 16px; }
            .card-header .title { font-size: 16px !important; }
            .card-header .subtitle { font-size: 11px; }
            .status-badge { font-size: 10px; padding: 3px 8px; }
            .plan-info { padding: 12px 16px; gap: 10px; font-size: 11px; }
            .quota-hero .remaining-value { font-size: 26px !important; }
            .tokenplan-body { padding: 12px 16px !important; }
            .detail-grid { gap: 8px; }
            .detail-item { padding: 10px 12px; }
            .detail-item .val { font-size: 14px; }
            .detail-item .label { font-size: 10px; }
            .xiaomi-section { padding: 12px 16px; }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] {
                gap: 6px !important;
                flex-wrap: nowrap !important;
                white-space: nowrap;
                overflow-x: auto;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span {
                white-space: nowrap;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:24px"] {
                font-size: 16px !important;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:28px"] {
                font-size: 18px !important;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:16px"] {
                font-size: 12px !important;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:12px"] {
                font-size: 10px !important;
            }
            .xiaomi-section div[style*="display:flex;align-items:baseline"] span[style*="font-size:13px"] {
                font-size: 11px !important;
            }
            .card-footer { padding: 10px 16px; font-size: 10px; }
            .exhausted-text { font-size: 20px; }
            /* 火山余额 */
            .tokenplan-body > div > div[style*="font-size:36px"] {
                font-size: 28px !important;
            }
            /* DeepSeek 余额 */
            .plan-card > div[style*="padding:8px 16px"] > div > div > div[style*="font-size:26px"] {
                font-size: 20px !important;
            }
            .plan-card > div[style*="padding:8px 16px"] > div > div > div[style*="font-size:24px"] {
                font-size: 18px !important;
            }
            /* 模型详情卡片 */
            .plan-card > div[style*="padding:0 16px"] > div > div[style*="display:flex;gap:8px"] {
                flex-wrap: wrap !important;
            }
            .plan-card > div[style*="padding:0 16px"] > div > div[style*="display:flex;gap:8px"] > div {
                flex: 1 1 45% !important;
                margin-bottom: 4px;
            }
            /* 余额横幅三列变列 */
            div[style*="display:flex;justify-content:space-evenly"] {
                flex-wrap: wrap !important;
                gap: 8px;
            }
            .cred-table { font-size: 11px; }
            .cred-table th, .cred-table td { padding: 6px 8px; }
            .admin-card .btn { font-size: 11px; padding: 4px 8px; }
            /* 顶栏移动端 */
            .top-bar { padding: 10px 12px; gap: 4px; }
            .top-bar h1 { font-size: 14px; }
            .top-bar h1 span { display: block; font-size: 10px !important; text-align: left; }
            .top-bar h1 #version-tag { font-size: 10px !important; display: block; color: #4ade80; -webkit-text-fill-color: #4ade80; }
            .top-bar .nav-btns { gap: 4px; }
            .top-bar .nav-btns button { font-size: 13px; padding: 4px 8px; }
            .top-bar .nav-btns button .btn-label { display: none; }
            .top-bar .meta > span:first-child { display: none; }
            .top-bar .meta > span:nth-child(2) > span:first-child { display: none; }
            .top-bar .meta > span:not(:first-child) { font-size: 10px; }
        }
        @media (max-width: 480px) {
            .card-header .title { font-size: 14px !important; }
            .quota-hero .remaining-value { font-size: 22px !important; }
            .detail-item .val { font-size: 13px; }
            .status-badge { font-size: 9px; padding: 2px 6px; }
        }

        /* ====== Cookie 失效警告横幅 ====== */
        .cookie-alert {
            background: linear-gradient(135deg, #7f1d1d, #991b1b);
            border: 1px solid #dc2626;
            border-radius: 10px;
            padding: 10px 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #fca5a5;
            animation: alertPulse 2s ease-in-out infinite;
        }
        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.3); }
            50% { box-shadow: 0 0 20px 4px rgba(220, 38, 38, 0.2); }
        }

        /* ====== 页面切换 ====== */
        .page { display: none; }
        .page.active { display: block; }

        /* ====== 平台卡片 flexbox响应式 [v2-05050300] ====== */
        .platform-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .platform-grid > .plan-card {
            flex: 0 1 auto;
            width: 340px;
            max-width: 100%;
        }
        @media (min-width: 1400px) {
            .platform-grid > .plan-card { width: calc(33.33% - 11px); }
        }
        @media (max-width: 640px) {
            .platform-grid { gap: 12px; }
            .platform-grid > .plan-card { flex: 1 1 100%; min-width: 0; }
            .card-header { padding: 14px 16px; }
            .card-header .title { font-size: 16px !important; }
            .card-header .subtitle { font-size: 11px; }
            .plan-info { padding: 12px 16px; gap: 10px; font-size: 11px; }
            .quota-body { padding: 14px 16px !important; }
            .quota-top { flex-wrap: wrap; gap: 4px; }
            .quota-label { font-size: 13px; }
            .quota-remaining { font-size: 13px; }
            .quota-total-hint { display: none; }
        }

        /* ====== 卡片基础 ====== */
        .plan-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            min-width: 0;
            width: 100%;
        }
        .card-header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        .card-header .title { font-size: 18px; font-weight: 700; color: #f1f5f9; }
        .card-header .subtitle { font-size: 13px; color: #64748b; margin-top: 2px; }
        .status-badge { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
        .badge-available { background: rgba(34,197,94,0.15); color: #4ade80; }
        .badge-warning   { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .badge-exhausted { background: rgba(239,68,68,0.15); color: #f87171; }

        .plan-info {
            padding: 16px 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #94a3b8;
            border-bottom: 1px solid #1e293b;
        }
        .plan-info span { display: flex; align-items: center; gap: 4px; }

        /* ====== Coding Plan: 三层配额 ====== */
        .quota-body { padding: 20px 24px; }
        .quota-item { margin-bottom: 16px; }
        .quota-item:last-child { margin-bottom: 0; }
        .quota-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .quota-label { font-size: 14px; font-weight: 500; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
        .quota-total-hint { font-size: 12px; color: #64748b; font-weight: 400; }
        .quota-remaining { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .progress-track { width: 100%; height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 5px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .fill-green { background: linear-gradient(90deg, #22c55e, #4ade80); }
        .fill-blue { background: linear-gradient(90deg, #2563eb, #60a5fa); }
        .fill-yellow { background: linear-gradient(90deg, #eab308, #fbbf24); }
        .fill-red { background: linear-gradient(90deg, #dc2626, #f87171); }
        .quota-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .quota-pct { font-size: 16px; font-weight: 700; }
        .quota-refresh { font-size: 11px; color: #4b5563; }

        /* ====== 传统计划 ====== */
        .tokenplan-body { padding: 24px; }

        /* ====== MIMO 卡片区块 ====== */
        .xiaomi-section {
            padding: 16px 24px;
            border-bottom: 1px solid #1e293b;
        }
        .xiaomi-section:last-of-type { border-bottom: none; }
        .quota-hero { text-align: center; margin-bottom: 20px; }
        .quota-hero .remaining-label { font-size: 13px; color: #64748b; margin-bottom: 4px; }
        .quota-hero .remaining-value { font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; }
        .quota-hero .remaining-unit { font-size: 16px; font-weight: 400; color: #94a3b8; margin-left: 4px; }
        .quota-hero .total-hint { font-size: 12px; color: #4b5563; margin-top: 4px; }
        .progress-section { margin-bottom: 20px; }
        .progress-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .detail-item { background: #0d1117; border-radius: 10px; padding: 14px 16px; }
        .detail-item .label { font-size: 11px; color: #64748b; margin-bottom: 4px; }
        .detail-item .val { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

        .card-footer {
            padding: 12px 24px;
            background: #0d1117;
            font-size: 11px;
            color: #4b5563;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ====== 无数据 / 需更新凭证 卡片 ====== */
        .nodata-card { border: 1px dashed rgba(251,191,36,0.35); background: #0f172a; }
        .nodata-body {
            padding: 28px 24px 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .nodata-icon { font-size: 34px; opacity: 0.9; }
        .nodata-msg {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            max-width: 480px;
        }
        .nodata-err-at {
            font-size: 12px;
            color: #94a3b8;
            background: rgba(148,163,184,0.08);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .nodata-btn { margin-top: 6px; }

        /* ====== 数据过期提示条（有数据但近期采集失败） ====== */
        .stale-banner {
            background: linear-gradient(90deg, rgba(251,191,36,0.20), rgba(251,191,36,0.07));
            color: #fcd34d;
            font-size: 12.5px;
            font-weight: 600;
            padding: 9px 22px;
            border-bottom: 1px solid rgba(251,191,36,0.28);
            letter-spacing: 0.2px;
            line-height: 1.4;
        }

        /* ====== MiniMax 气泡卡片 ====== */
        .minimax-quota-bubbles {
            display: flex; gap: 10px; flex-wrap: wrap;
        }
        .minimax-quota-bubble {
            background: rgba(30,41,59,0.6); border: 1px solid rgba(51,65,85,0.4);
            border-radius: 8px; padding: 8px 12px; display: flex; gap: 6px; align-items: center;
            font-size: 13px;
        }
        .minimax-quota-label { color: #64748b; font-size: 12px; }
        .minimax-quota-val { color: #e2e8f0; font-weight: 600; }
        .minimax-day-row {
            display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(30,41,59,0.5);
        }
        .minimax-day-date { width: 42px; font-size: 12px; color: #64748b; flex-shrink: 0; }
        .minimax-day-bar-wrap { flex: 1; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; }
        .minimax-day-bar { height: 100%; background: linear-gradient(90deg, #f59e0b, #a78bfa); border-radius: 3px; transition: width 0.4s; }
        .minimax-day-tokens { font-size: 12px; color: #94a3b8; min-width: 56px; text-align: right; }
        .minimax-day-count { font-size: 11px; color: #4b5563; min-width: 32px; }

        /* ====== 腾讯子服务 ====== */
        .sub-service { border-bottom: 1px solid #1e293b; position: relative; }
        .sub-service:last-of-type { border-bottom: none; }
        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #0d1117;
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
        }
        .sub-hide-btn {
            background: none; border: none; color: #4b5563; font-size: 16px;
            cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all 0.2s;
            line-height: 1;
        }
        .sub-hide-btn:hover { color: #ef4444; background: rgba(239,68,68,0.1); }
        .sub-hide-btn.disabled { opacity: 0.3; cursor: not-allowed; }
        .sub-hide-btn.disabled:hover { color: #4b5563; background: none; }

        /* ====== 蓝色遮罩：额度已用尽 ====== */
        .exhausted-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 64, 175, 0.25);
            backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; animation: fadeIn 0.5s ease;
        }
        .exhausted-text { font-size: 28px; font-weight: 800; color: #ef4444; text-shadow: 0 0 20px rgba(239,68,68,0.5); letter-spacing: 4px; margin-bottom: 12px; }
        .exhausted-recovery { font-size: 14px; color: #93c5fd; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .exhausted-recovery .time { font-size: 16px; font-weight: 600; color: #bfdbfe; }
        .exhausted-recovery .countdown { font-size: 13px; color: #60a5fa; }

        /* 子服务级别遮罩（文字稍小） */
        .sub-exhausted-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 64, 175, 0.25);
            backdrop-filter: blur(4px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; animation: fadeIn 0.5s ease;
        }
        .sub-exhausted-overlay .exhausted-text { font-size: 20px; letter-spacing: 3px; margin-bottom: 8px; }
        .sub-exhausted-overlay .exhausted-recovery { font-size: 12px; }
        .sub-exhausted-overlay .exhausted-recovery .time { font-size: 14px; }
        .sub-exhausted-overlay .exhausted-recovery .countdown { font-size: 12px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ====== 颜色工具 ====== */
        .green { color: #4ade80; }
        .yellow { color: #fbbf24; }
        .red { color: #f87171; }
        .blue { color: #60a5fa; }
        .blue { color: #60a5fa; }

        .empty-state { text-align: center; padding: 40px; color: #4b5563; }
        .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
        .empty-state .msg { font-size: 14px; margin-bottom: 8px; }
        .empty-state .hint { font-size: 12px; color: #64748b; }

        /* ====== 认证相关 ====== */
        .auth-container {
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
        }
        .auth-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 40px 32px;
        }
        .auth-card .auth-icon { font-size: 48px; margin-bottom: 16px; }
        .auth-card .auth-title { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
        .auth-card .auth-desc { font-size: 13px; color: #64748b; margin-bottom: 24px; }
        .auth-card .form-group { margin-bottom: 16px; text-align: left; }
        .auth-card .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        .auth-card .form-group input {
            width: 100%; padding: 12px 16px;
            background: #0d1117; border: 1px solid #1e293b; border-radius: 8px;
            color: #e2e8f0; font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .auth-card .form-group input:focus { border-color: #60a5fa; }
        .auth-card .auth-error { font-size: 12px; color: #f87171; margin-top: 8px; min-height: 18px; }
        .auth-card .btn { width: 100%; padding: 12px; font-size: 14px; }

        .admin-locked-notice {
            text-align: center; padding: 60px 20px; color: #4b5563;
        }
        .admin-locked-notice .icon { font-size: 48px; margin-bottom: 16px; }
        .admin-locked-notice .msg { font-size: 16px; margin-bottom: 8px; color: #94a3b8; }
        .admin-locked-notice .hint { font-size: 12px; color: #64748b; }

        /* 登出按钮 */
        .logout-btn {
            padding: 4px 12px; border-radius: 6px; border: 1px solid #1e293b;
            background: transparent; color: #64748b; font-size: 12px; cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover { border-color: #ef4444; color: #ef4444; }

        /* ====== 管理后台 ====== */
        /* Tab 导航 */
        .admin-tabs { display: flex; gap: 4px; margin-bottom: 24px; background: #0d1117; border-radius: 12px; padding: 4px; border: 1px solid #1e293b; }
        .admin-tab { flex: 1; padding: 10px 16px; border: none; border-radius: 10px; background: transparent; color: #64748b; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .admin-tab:hover { color: #94a3b8; background: rgba(255,255,255,0.03); }
        .admin-tab.active { background: #1e293b; color: #e2e8f0; font-weight: 600; }
        .admin-tab-content { display: none; }
        .admin-tab-content.active { display: block; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .admin-card { background: #111827; border: 1px solid #1e293b; border-radius: 14px; padding: 24px; }
        .admin-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .admin-card.full-width { flex:0 0 100%;min-width:0; }
        .cred-table { width: 100%; border-collapse: collapse; }
        .cred-table th { text-align: left; padding: 10px 12px; font-size: 12px; color: #64748b; border-bottom: 1px solid #1e293b; }
        .cred-table td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #0d1117; }

<script>
/* ====== 配置 ====== */
const NAMES = {
    tencent:'腾讯云', tencent_codingplan:'Coding Plan',
    tencent_hy_tokenplan:'Hy Token Plan', tencent_tokenplan:'Token Plan（通用）',
    volcano:'火山引擎', volcano_codingplan:'Coding Plan + Agent Plan', volcano_ark:'火山方舟',
    volcano_balance:'火山方舟',
    xiaomi:'MIMO',
    deepseek:'DeepSeek',
    minimax:'MiniMax', minimax_gateway:'MiniMax中转',
    gpt_gateway:'GPT中转',
};

/* 子平台 → 父平台映射 */
const SUB_TO_PARENT = {
    tencent_codingplan:'tencent', tencent_hy_tokenplan:'tencent', tencent_tokenplan:'tencent',
    volcano_codingplan:'volcano', volcano_ark:'volcano', volcano_balance:'volcano',
};

/* 平台官网链接 */
const PLATFORM_URLS = {
    tencent:'https://console.cloud.tencent.com/tokenhub/codingplan',
    volcano:'https://console.volcengine.com/ark/region:ark+cn-beijing/plan',
    xiaomi:'https://platform.xiaomimimo.com/console/plan-manage',
    deepseek:'https://platform.deepseek.com/usage',
    minimax:'https://platform.minimaxi.com/console/usage',
    minimax_gateway:'https://minnimax.chat/usage',
    gpt_gateway:'http://68.64.183.211/dashboard',
};

/* 点击平台卡片标题跳转官方链接 */
document.addEventListener('click', function(e) {
    if (e.target.closest('button') || e.target.closest('a') || e.target.closest('input') || e.target.closest('select')) return;
    const title = e.target.closest('.platform-title');
    if (!title) return;
    const url = PLATFORM_URLS[title.dataset.platform];
    if (url) window.open(url, '_blank');
});

let cd = 30;
let lastDataHash = '';
window._refreshInterval = 30;

/* ====== 认证状态 ====== */
let authToken = localStorage.getItem('token') || '';
let isLoggedIn = false;
let hasPassword = false;

/* 带认证的 fetch 封装 */
async function authFetch(url, options = {}) {
    if (authToken) {
        if (!options.headers) options.headers = {};
        options.headers['Authorization'] = 'Bearer ' + authToken;
    }
    const resp = await fetch(url, options);
    if (resp.status === 401) {
        // Token 过期，清除登录状态
        clearAuth();
        toast('登录已过期，请重新登录', 'error');
        // 如果在管理页，刷新认证区域
        if (document.getElementById('page-admin').classList.contains('active')) {
            renderAuthArea();
        }
        throw new Error('未授权');
    }
    return resp;
}

/* 清除认证 */
function clearAuth() {
    authToken = '';
    isLoggedIn = false;
    localStorage.removeItem('token');
    updateAuthUI();
}

/* 更新认证相关UI */
function updateAuthUI() {
    const indicator = document.getElementById('auth-indicator');
    if (isLoggedIn) {

/* 首次设置密码 */
async function doSetup() {
    const pw = document.getElementById('setup-password').value;
    const pw2 = document.getElementById('setup-password2').value;
    const errEl = document.getElementById('setup-error');

    if (pw.length < 4) { errEl.textContent = '密码至少4位'; return; }
    if (pw !== pw2) { errEl.textContent = '两次密码不一致'; return; }

    try {
        const resp = await fetch('/api/auth/setup', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ password: pw })
        });
        const data = await resp.json();
        if (resp.ok && data.token) {
            authToken = data.token;
            isLoggedIn = true;
            hasPassword = true;
            localStorage.setItem('token', authToken);
            updateAuthUI();
            toast('密码设置成功，已登录', 'success');
            renderAuthArea();
            loadAdminData();
        } else {
            errEl.textContent = data.detail || '设置失败';
        }
    } catch(e) {
        errEl.textContent = '请求失败';
    }
}

/* 登录 */
async function doLogin() {
    const pw = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');

    if (!pw) { errEl.textContent = '请输入密码'; return; }

    try {
        const resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ password: pw })
        });
        const data = await resp.json();
        if (resp.ok && data.token) {
            authToken = data.token;
            isLoggedIn = true;
            localStorage.setItem('token', authToken);
            updateAuthUI();
            toast('登录成功', 'success');
            renderAuthArea();
            loadAdminData();
        } else {
            errEl.textContent = data.detail || '登录失败';
        }
    } catch(e) {
        errEl.textContent = '请求失败';
    }
}

/* 登出 */
async function doLogout() {
    try {
        await authFetch('/api/auth/logout', { method: 'POST' });

/* 修改密码 */
async function changePassword() {
    const oldPw = document.getElementById('old-password').value;
    const newPw = document.getElementById('new-password').value;
    if (!oldPw || !newPw) { toast('请填写完整', 'error'); return; }
    if (newPw.length < 4) { toast('新密码至少4位', 'error'); return; }
    try {
        const resp = await authFetch('/api/auth/change-password', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ old_password: oldPw, new_password: newPw })
        });
        const data = await resp.json();
        if (resp.ok) {
            toast('密码已修改', 'success');
            document.getElementById('old-password').value = '';
            document.getElementById('new-password').value = '';

            toast(data.detail || '修改失败', 'error');

}

/* ====== 颜色规则 ====== */
function getColorClass(pct) {
    if (pct >= 80) return { fill: 'fill-red', text: 'red' };
    if (pct >= 50) return { fill: 'fill-yellow', text: 'yellow' };
    return { fill: 'fill-green', text: 'green' };
}
/* 腾讯云每月额度独立颜色：70黄 90红，以下蓝色 */
function getMonthlyColorClass(pct) {
    if (pct >= 90) return { fill: 'fill-red', text: 'red' };
    if (pct >= 70) return { fill: 'fill-yellow', text: 'yellow' };
    return { fill: 'fill-blue', text: 'blue' };
}
function getStatusBadge(usedPct) {
    if (usedPct >= 100) return { cls: 'badge-exhausted', text: '额度已用尽' };
    if (usedPct >= 80)  return { cls: 'badge-warning', text: '额度紧张' };
    return { cls: 'badge-available', text: '可用' };
}
function fmt(n) {
    if (!n) return '0';
    if (n >= 1e8) return (n/1e8).toFixed(2) + ' 亿';
    if (n >= 1e7) return (n/1e7).toFixed(2) + ' 千万';
    if (n >= 1e6) return (n/1e6).toFixed(2) + ' 百万';
    if (n >= 1e5) return (n/1e5).toFixed(2) + ' 十万';
    if (n >= 1e4) return (n/1e4).toFixed(2) + ' 万';
    if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return n.toLocaleString();
}

/* ====== 监控页 ====== */

async function load() {
    try {
        const [stats, cookieSt] = await Promise.all([
            fetch('/api/stats').then(r=>r.json()).catch(()=>{return {platforms:[],version:''}}),
            fetch('/api/cookie-status').then(r=>r.json()).catch(()=>[]),
        ]);
        // 从 API 同步版本号
        if (stats.version && stats.version !== APP_VERSION) {
            document.getElementById('version-tag').textContent = stats.version;
        }
        // 数据哈希对比：数据没变不重渲染，避免排序跳动
        const newHash = JSON.stringify(stats.platforms.map(p => ({
            p: p.platform, lu: p.last_updated, nt: p.total_tokens, b: p.balance,
            c: p.monthly_cost, nu: (p.model_usages||[]).map(m => m.model + m.response),
            le: p.last_error, e: p.error, ce: p.cookie_expired
        })));
        if (newHash !== lastDataHash) {
            lastDataHash = newHash;
            renderPlatforms(stats.platforms || []);
        }
        renderCookieAlert(cookieSt);
        document.getElementById('status').textContent = '已连接';
        lastRefreshTime = Date.now();
        if (stats.refresh_interval) {
            window._refreshInterval = Math.max(10, stats.refresh_interval);
        }
        if (document.getElementById('page-admin').classList.contains('active')) {
            loadRefreshLog();
        }
    } catch(e) {
        document.getElementById('status').textContent = '连接失败';
    }
}

/* ====== Cookie 失效警告 ====== */
function renderCookieAlert(statusList) {
    const container = document.getElementById('cookie-alert-container');
    if (!statusList || !statusList.length) { container.innerHTML = ''; return; }

    const failed = statusList.filter(s => !s.healthy);
    if (!failed.length) { container.innerHTML = ''; return; }

    // 把子平台聚合到父平台，统一视为 Cookie 过期
    const platformGroups = {};
    failed.forEach(s => {
        const parent = SUB_TO_PARENT[s.platform] || s.platform;
        if (!platformGroups[parent]) platformGroups[parent] = [];
    });

    const names = Object.keys(platformGroups).map(p => escHtml(NAMES[p] || p) + '平台');
    const text = names.join('、') + ' Cookie 已过期！';

    container.innerHTML = '<div class="cookie-alert expired">⚠️ ' + text + '</div>';
}

function renderPlatforms(platforms) {
    // 权重模式：从 localStorage 读取拖动顺序覆盖后端排序
    const saved = JSON.parse(localStorage.getItem('platform_order') || '[]');
    const sortModeToggle = document.getElementById('sort_mode-toggle');
    const isWeight = sortModeToggle && !sortModeToggle.checked;
    if (isWeight && saved.length) {
        const savedSet = new Set(saved);
        // 先把有记录的平台按拖动顺序排
        const ordered = [];
        const extra = [];
        for (const p of saved) {
            const found = platforms.find(x => x.platform === p);
            if (found) ordered.push(found);
        }
        // 新增平台（拖动后新加的凭证）排在最后
        for (const p of platforms) {
            if (!savedSet.has(p.platform)) extra.push(p);
        }
        platforms = [...ordered, ...extra];
    }
    
    const el = document.getElementById('platforms');
    if (!platforms.length) {
        el.innerHTML = '<div class="empty-state"><div class="icon">📊</div><div class="msg">暂无平台数据</div><div class="hint">前往 ⚙️管理 添加凭证并刷新数据</div></div>';
        return;
    }
    el.innerHTML = platforms.map(p => {
        let card;
        if (p.no_data) card = renderNoDataCard(p);
        else if (p.platform === 'tencent' && p.services) card = renderTencentCard(p);
        else if (p.platform === 'volcano' && p.services) card = renderVolcanoGroupCard(p);
        else if (p.platform === 'xiaomi') card = renderXiaomiCard(p);
        else if (p.platform === 'minimax' || p.platform === 'minimax_gateway') card = renderMiniMaxCard(p);
        else if (p.platform === 'gpt_gateway') card = renderGptGatewayCard(p);
        else if (p.quotas) card = renderCodingPlan(p);
        else if (p.remaining_pct !== undefined) card = renderTokenPlan(p);
        else card = renderFallback(p);
        // 有数据但近期采集失败：在卡片顶部注入“数据可能过期”提示条
        if (p.last_error) {
            const banner = '<div class="stale-banner">⚠️ 数据可能过期 · ' + escHtml(p.last_error) +
                (p.last_error_at ? ' · 最近失败 ' + escHtml(p.last_error_at) : '') + '</div>';
            card = card.replace(/<div class="plan-card[^>]*>/, m => m + banner);
        }
        return card;
    }).join('');
}

/* ====== 火山引擎大卡 ====== */
function renderVolcanoGroupCard(p) {
    const services = p.services || [];
    const visibleServices = services.filter(s => {
        if (s.balance_available !== undefined && s.balance_available <= 0 && !s.quotas && !s.afp_quotas && s.remaining_pct === undefined) return false;
        return true;
    });
    let worstPct = 0, hasExhausted = false;
    visibleServices.forEach(s => {
        let usedPct = 0;
        const allQuotas = {...(s.quotas||{}), ...(s.afp_quotas||{})};
        if (Object.keys(allQuotas).length > 0) usedPct = Math.max(...Object.values(allQuotas).map(q => q.used_pct || 0));
        else if (s.remaining_pct !== undefined) usedPct = 100 - s.remaining_pct;
        if (usedPct >= 100) hasExhausted = true;
        worstPct = Math.max(worstPct, usedPct);
    });
    const anyExhausted = visibleServices.some(s => {
        if (s.remaining_pct !== undefined && s.remaining_pct <= 0) return true;
        const allQuotas = {...(s.quotas||{}), ...(s.afp_quotas||{})};
        return Object.values(allQuotas).some(q => q.used_pct >= 100);
    });
    const badge = getStatusBadge(anyExhausted ? 100 : worstPct);

    let servicesHtml = visibleServices.map(s => {
        let subName = NAMES[s.platform] || s.platform;
        if (s.platform === 'volcano' && s.balance_available !== undefined) subName = '火山方舟';
        if (s.quotas || s.afp_quotas) return renderSubCodingPlan(s, subName);
        if (s.remaining_pct !== undefined) return renderSubTokenPlan(s, subName);
        if (s.balance_available !== undefined) return renderVolcanoBalanceSub(s, subName);
        return '<div class="sub-service"><div class="sub-header">' + subName + '</div><div style="padding:12px;color:#4b5563">数据格式异常</div></div>';
    }).join('');

    return '<div class="plan-card" style="flex:0 0 100%;min-width:0"><div class="card-header"><div><div class="title platform-title" style="font-size:22px;cursor:pointer" data-platform="volcano">' + brandIcon('volcano', 20) + '火山引擎</div><div class="subtitle">' + visibleServices.length + ' 个服务 · 北京区域</div></div><span class="status-badge ' + badge.cls + '">' + badge.text + '</span></div><div style="padding:0">' + servicesHtml + '</div><div class="card-footer"><span>火山引擎 · ' + visibleServices.length + ' 个服务</span><span>' + (p.last_updated ? new Date(p.last_updated).toLocaleTimeString() : '-') + '</span></div></div>';
}

/* 子服务: 火山余额 */
function renderVolcanoBalanceSub(s, name) {
    const available = s.balance_available || 0;
    const cash = s.balance_cash || 0;
    const credit = s.balance_credit || 0;
    const frozen = s.balance_frozen || 0;
    const arrears = s.balance_arrears || 0;
    const isLow = available < 10;
    const isExhausted = available <= 0 || arrears > 0;
    const badge = isExhausted ? getStatusBadge(100) : isLow ? getStatusBadge(70) : getStatusBadge(30);
    const c = getColorClass(isExhausted ? 100 : isLow ? 70 : 30);

    let balanceHtml = '<div style="display:flex;align-items:baseline;gap:12px;padding:16px 24px">' +
        '<span style="font-size:13px;color:#64748b">可用余额</span>' +
        '<span style="font-size:28px;font-weight:800" class="' + c.text + '">¥' + available.toFixed(2) + '</span>' +
        '<span style="font-size:12px;color:#94a3b8">现金 ¥' + cash.toFixed(2) +
        (credit > 0 ? ' · 信控 ¥' + credit.toFixed(2) : '') +
        (frozen > 0 ? ' · 冻结 ¥' + frozen.toFixed(2) : '') +
        (arrears > 0 ? ' · <span style="color:#ef4444">欠费 ¥' + arrears.toFixed(2) + '</span>' : '') +
        '</span></div>';

    return '<div class="sub-service"><div class="sub-header"><span>' + name + '</span><span style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#64748b">按量付费</span><span class="status-badge ' + badge.cls + '" style="font-size:11px;padding:2px 8px">' + badge.text + '</span></span></div>' + balanceHtml + '</div>';
}

/* ====== 腾讯大卡 ====== */
function renderTencentCard(p) {
    const services = p.services || [];
    let worstPct = 0, hasExhausted = false;
    services.forEach(s => {
        let usedPct = 0;
        if (s.quotas) usedPct = Math.max(...Object.values(s.quotas).map(q => q.used_pct || 0));

/* 平台品牌 SVG 图标 */
function brandIcon(platform, size=22) {

/* 子服务: Coding Plan */
function renderSubCodingPlan(s, name) {
    const quotaLabels = { 'daily': {name:'每日',icon:'📆'}, '5h': {name:'每5小时',icon:'⚡'}, 'weekly': {name:'每周',icon:'📅'}, 'monthly': {name:'每订阅月',icon:'📆'} };
    const afpLabels = { '5h': {name:'每5小时',icon:'⚡'}, 'weekly': {name:'每周',icon:'📅'}, 'monthly': {name:'每订阅月',icon:'📆'} };

    /* 渲染一组配额为 HTML，返回 {html, hasExhausted, recoveryTime} */
    function renderQuotaBlock(quotas, labels, unit) {
        let html = '';
        let blockExhausted = false;
        let blockRecovery = '';
        for (const [key, info] of Object.entries(quotas)) {
            const label = labels[key] || {name:key,icon:'📊'};
            const pct = info.used_pct || 0;
            const hasTotal = info.total > 0;
            const remaining = hasTotal ? (info.total - Math.round(info.total * pct / 100)) : 0;
            const c = (key === 'monthly') ? getMonthlyColorClass(pct) : getColorClass(pct);
            const isBlocked = pct >= 100;
            if (isBlocked) { blockExhausted = true; if (info.refresh_at && (!blockRecovery || info.refresh_at < blockRecovery)) blockRecovery = info.refresh_at; }
            const totalHint = hasTotal ? '<span class="quota-total-hint">(总量 ' + info.total.toLocaleString() + ' ' + unit + ')</span>' : '';
            const remainingText = hasTotal ? '剩余 ' + remaining.toLocaleString() + ' ' + unit : (100-pct).toFixed(1) + '% 可用';
            html += '<div class="quota-item"><div class="quota-top"><span class="quota-label">' + label.icon + ' ' + label.name + ' ' + totalHint + (isBlocked ? '<span style="color:#f87171;font-size:12px;font-weight:700">⛔ 已用尽</span>' : '') + '</span><span class="quota-remaining ' + c.text + '">' + remainingText + '</span></div><div class="progress-track"><div class="progress-fill ' + c.fill + '" style="width:' + Math.min(pct,100) + '%"></div></div><div class="quota-footer"><span class="quota-pct ' + c.text + '">' + pct.toFixed(1) + '% 已用</span><span class="quota-refresh">' + (isBlocked ? '🔄 ' + (info.refresh_at || '') + ' 恢复' : '🔄 ' + (info.refresh_at || '') + ' 刷新') + '</span></div></div>';
        }
        return { html, blockExhausted, blockRecovery };
    }

    const q = s.quotas || {};
    const afq = s.afp_quotas || {};
    const hasAfp = Object.keys(afq).length > 0;

    // 各区块独立判断是否用尽
    const tokenResult = Object.keys(q).length > 0 ? renderQuotaBlock(q, quotaLabels, '') : null;
    const afpResult = hasAfp ? renderQuotaBlock(afq, afpLabels, 'AFP') : null;

    // 综合最差状态（仅用于头部徽章）
    const allPcts = [...Object.values(q).map(v => v.used_pct || 0), ...Object.values(afq).map(v => v.used_pct || 0)];
    const worstPct = allPcts.length ? Math.max(...allPcts) : 0;
    const anyExhausted = allPcts.some(v => v >= 100);
    const badge = anyExhausted ? getStatusBadge(100) : getStatusBadge(worstPct);

    // Token 配额区（气泡风格）
    let quotaHtml = '';
    if (tokenResult) {
        if (hasAfp) {
            quotaHtml += '<div style="margin:6px 8px 0;padding:10px 14px;background:rgba(30,41,59,0.5);border-radius:10px;border:1px solid rgba(51,65,85,0.5);position:relative">';
            if (tokenResult.blockExhausted && tokenResult.blockRecovery) {
                quotaHtml += '<div style="position:absolute;inset:0;background:rgba(220,38,38,0.08);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2"><span style="color:#f87171;font-size:14px;font-weight:700">额度已用尽</span><span style="color:#fca5a5;font-size:12px">恢复 ' + tokenResult.blockRecovery + '</span></div>';
            }
            quotaHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(51,65,85,0.3)"><span style="font-size:13px;font-weight:600;color:#e2e8f0">🔤 Token 配额</span>' + (s.cost ? '<span style="font-size:12px;color:#60a5fa">' + s.cost + '元/月</span>' : '') + '</div>';
            quotaHtml += tokenResult.html;
            quotaHtml += '</div>';
        } else {
            quotaHtml += tokenResult.html;
        }
    }

    // AFP 配额区（气泡风格，独立遮罩）
    if (hasAfp && afpResult) {
        quotaHtml += '<div style="margin:6px 8px 0;padding:10px 14px;background:rgba(30,41,59,0.5);border-radius:10px;border:1px solid rgba(51,65,85,0.5);position:relative">';
        if (afpResult.blockExhausted && afpResult.blockRecovery) {
            quotaHtml += '<div style="position:absolute;inset:0;background:rgba(220,38,38,0.08);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2"><span style="color:#f87171;font-size:14px;font-weight:700">额度已用尽</span><span style="color:#fca5a5;font-size:12px">恢复 ' + afpResult.blockRecovery + '</span></div>';
        }
        quotaHtml += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(51,65,85,0.3)"><span style="font-size:13px;font-weight:600;color:#e2e8f0">🤖 Agent Plan · AFP 配额</span>' + (s.afp_cost ? '<span style="font-size:12px;color:#60a5fa">' + s.afp_cost + '元/月</span>' : '') + '</div>';
        quotaHtml += afpResult.html;
        quotaHtml += '</div>';
    }

    // 计划信息：套餐名（价格在气泡内显示）
    let planInfoParts = [];
    if (s.plan_type) planInfoParts.push(s.plan_type);
    if (hasAfp && s.afp_plan_type) planInfoParts.push(s.afp_plan_type);
    const planInfoStr = planInfoParts.join(' · ');

    const quotaBodyStyle = hasAfp ? 'position:relative;padding:4px 4px' : 'position:relative';

    return '<div class="sub-service"><div class="sub-header"><span>' + name + '</span><span style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#64748b">' + planInfoStr + '</span><span class="status-badge ' + badge.cls + '" style="font-size:11px;padding:2px 8px">' + badge.text + '</span></span></div><div class="quota-body" style="' + quotaBodyStyle + '">' + quotaHtml + '</div></div>';
}

/* 子服务: 传统额度 */
function renderSubTokenPlan(s, name) {
    const usedPct = 100 - (s.remaining_pct || 0);
    const c = getColorClass(usedPct);
    const badge = getStatusBadge(usedPct);
    const total = s.total_tokens || 0, used = s.input_tokens || 0, remaining = s.output_tokens || 0;
    return '<div class="sub-service"><div class="sub-header"><span>' + name + '</span><span style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#64748b">' + (s.plan_type||'') + ' · ' + (s.remaining_days?s.remaining_days+'天':'') + '</span><span class="status-badge ' + badge.cls + '" style="font-size:11px;padding:2px 8px">' + badge.text + '</span></span></div><div style="padding:16px 24px"><div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px"><span style="font-size:13px;color:#64748b">剩余</span><span style="font-size:28px;font-weight:800" class="' + c.text + '">' + fmt(remaining) + '</span><span style="font-size:16px;font-weight:600" class="' + c.text + '">(' + (s.remaining_pct||0).toFixed(1) + '%)</span><span style="font-size:12px;color:#4b5563">/ 套餐 ' + fmt(total) + '</span></div><div class="progress-track" style="margin-bottom:8px"><div class="progress-fill ' + c.fill + '" style="width:' + usedPct.toFixed(1) + '%"></div></div><div style="display:flex;justify-content:space-between;font-size:12px"><span class="' + c.text + '">已用 ' + usedPct.toFixed(1) + '%</span><span class="' + c.text + '">剩余 ' + (s.remaining_pct||0).toFixed(1) + '%</span></div></div></div>';
}

function renderCodingPlan(p) {
    const q = p.quotas || {};
    const labels = { 'daily':{name:'每日',icon:'📆'}, '5h':{name:'每5小时',icon:'⚡'}, 'weekly':{name:'每周',icon:'📅'}, 'monthly':{name:'每订阅月',icon:'📆'} };
    const isExhausted = Object.values(q).some(v => v.used_pct >= 100);
    const badge = getStatusBadge(isExhausted ? 100 : 0);
    let quotaHtml = '', recoveryTime = '';
    for (const [key, info] of Object.entries(q)) {
        const label = labels[key]||{name:key,icon:'📊'};
        const pct = info.used_pct||0;
        const hasTotal = info.total > 0;
        const remaining = hasTotal ? (info.total - Math.round(info.total*pct/100)) : 0;
        const c = (key === 'monthly') ? getMonthlyColorClass(pct) : getColorClass(pct), isBlocked = pct>=100;
        const totalHint = hasTotal ? '<span class="quota-total-hint">(总量 ' + info.total.toLocaleString() + ')</span>' : '';
        const remainingText = hasTotal ? '剩余 '+remaining.toLocaleString() : (100-pct).toFixed(1)+'% 可用';
        quotaHtml += '<div class="quota-item"><div class="quota-top"><span class="quota-label">' + label.icon + ' ' + label.name + ' ' + totalHint + (isBlocked?'<span style="color:#f87171;font-size:12px;font-weight:700">⛔</span>':'') + '</span><span class="quota-remaining '+c.text+'">' + remainingText + '</span></div><div class="progress-track"><div class="progress-fill '+c.fill+'" style="width:'+Math.min(pct,100)+'%"></div></div><div class="quota-footer"><span class="quota-pct '+c.text+'">'+pct.toFixed(1)+'% 已用</span><span class="quota-refresh">🔄 '+(info.refresh_at||'')+' 刷新</span></div></div>';
        if (info.used_pct>=100 && info.refresh_at && (!recoveryTime||info.refresh_at>recoveryTime)) recoveryTime=info.refresh_at;
    }
    const planName = p.plan_name || NAMES[p.platform] || p.platform || 'Coding Plan';
    const subtitle = (p.plan_name ? planName : (p.plan_type || 'Lite') + ' 套餐');
    const subPrefix = p.plan_name ? '' : '广州 · ';
    let planInfo = '';
    if (p.plan_name) {
        if (p.remaining_days) planInfo += '<span>⏳ ' + p.remaining_days + '天剩余</span>';
        planInfo += '<span>🔄 ' + (p.remaining || '') + '</span>';
    } else {
        planInfo += '<span>💰 ' + (p.cost ? p.cost + '元/月' : '-') + '</span>';
        if (p.remaining_days) planInfo += '<span>⏳ ' + p.remaining_days + '天剩余</span>';
        planInfo += '<span>📅 ' + (p.valid_from || '') + ' 至 ' + (p.valid_to || '') + '</span>';
    }
    const footerLabel = p.plan_name || (p.plan_type || 'Coding Plan');
    return '<div class="plan-card"><div class="card-header"><div><div class="title platform-title" style="cursor:pointer" data-platform="' + p.platform + '">'+brandIcon(p.platform,18)+(NAMES[p.platform]||p.platform)+'</div><div class="subtitle">'+subPrefix+subtitle+'</div></div><span class="status-badge '+badge.cls+'">'+badge.text+'</span></div><div class="plan-info">'+planInfo+'</div><div class="quota-body" style="position:relative">'+quotaHtml+(isExhausted&&recoveryTime?'<div class="exhausted-overlay"><div class="exhausted-text">额度已用尽</div><div class="exhausted-recovery"><span>恢复时间</span><span class="time">'+recoveryTime+'</span><span class="countdown" data-recovery="'+recoveryTime+'">计算中...</span></div></div>':'')+'</div><div class="card-footer"><span>'+footerLabel+'</span><span>'+(p.last_updated?new Date(p.last_updated).toLocaleTimeString():'-')+'</span></div></div>';
}

function renderTokenPlan(p) {

    for (const mu of modelUsages) {

        // 缓存命中率

        const cacheRate = totalPrompt > 0 ? (mu.prompt_cache_hit / totalPrompt * 100).toFixed(1) : 0;

                '<div style="flex:1;background:rgba(251,191,36,0.08);border-radius:6px;padding:8px 4px;text-align:center"><div style="color:#64748b;font-size:12px;white-space:nowrap">未命中缓存</div><div style="color:#fbbf24;font-weight:700;font-size:14px;margin-top:3px">' + mu.prompt_cache_miss.toLocaleString() + '</div></div>' +
                '<div style="flex:1;background:rgba(96,165,250,0.08);border-radius:6px;padding:8px 4px;text-align:center"><div style="color:#64748b;font-size:12px;white-space:nowrap">输出Token</div><div style="color:#60a5fa;font-weight:700;font-size:14px;margin-top:3px">' + mu.response.toLocaleString() + '</div></div>' +
                '<div style="flex:1;background:rgba(167,139,250,0.08);border-radius:6px;padding:8px 4px;text-align:center"><div style="color:#64748b;font-size:12px;white-space:nowrap">请求次数</div><div style="color:#a78bfa;font-weight:700;font-size:14px;margin-top:3px">' + mu.requests.toLocaleString() + '</div></div>' +
                '</div>' +
                '<div style="margin-top:8px;font-size:11px;color:#94a3b8;text-align:center">费用：缓存 ¥' + mu.cost_hit.toFixed(4) + ' · 未缓存 ¥' + mu.cost_miss.toFixed(4) + ' · 输出 ¥' + mu.cost_resp.toFixed(4) + ' = <span style="color:#f87171">¥' + mu.cost_total.toFixed(4) + '</span></div>'
            ) +
            '</div>';
        modelHtml += row;
    }

        '<div style="text-align:center;min-width:140px"><div style="font-size:13px;color:#94a3b8;margin-bottom:2px">月累计Token</div><div style="font-size:24px;font-weight:800;color:#e2e8f0;line-height:1.1">' + totalCompact + '</div><div style="font-size:11px;color:#64748b;margin-top:3px">(' + totalTokens.toLocaleString() + ')</div></div>' +
        '</div>';

        quotaHtml += '<div class="quota-item">' +
            '<div class="quota-top"><span class="quota-label">⚡ 5h 限额</span><span class="quota-remaining ' + cH.text + '">' + (100-hPct).toFixed(0) + '% 可用</span></div>' +

        '</div>';
        quotaHtml += '<div class="quota-item">' +
            '<div class="quota-top"><span class="quota-label">📅 周限额</span><span class="quota-remaining ' + cW.text + '">' + (100-wPct).toFixed(0) + '% 可用</span></div>' +
            '<div class="progress-track"><div class="progress-fill ' + cW.fill + '" style="width:' + Math.min(wPct,100) + '%"></div></div>' +
            '<div class="quota-footer"><span class="quota-pct ' + cW.text + '">' + wPct.toFixed(1) + '% 已用</span><span class="quota-refresh">' + (qWeekly.refresh_at ? '🔄 ' + qWeekly.refresh_at + ' 重置' : '') + '</span></div>' +
        '</div>';
    }

    let modelHtml = '';
    for (const mu of modelUsages) {
        const cacheHit = mu.cache_read_token || 0;
        const inputNoCache = mu.input_token || 0;
        const output = mu.output_token || 0;
        const totalModel = mu.total_token || (cacheHit + inputNoCache + output);
        const cacheRate = (cacheHit + inputNoCache) > 0 ? (cacheHit / (cacheHit + inputNoCache) * 100).toFixed(1) : '0';

        modelHtml += '<div style="margin-top:10px;padding:12px 14px;background:rgba(30,41,59,0.5);border-radius:10px;border:1px solid rgba(51,65,85,0.5)">' +

                '<span style="font-size:12px;color:#60a5fa">缓存命中率 ' + cacheRate + '%</span>' +
            '</div>' +
            (totalModel === 0
                ? '<div style="padding:12px 0;text-align:center;color:#64748b;font-size:13px">暂无用量</div>'

                '<div style="flex:1;background:rgba(251,191,36,0.08);border-radius:6px;padding:8px 4px;text-align:center"><div style="color:#64748b;font-size:12px;white-space:nowrap">输入Token</div><div style="color:#fbbf24;font-weight:700;font-size:14px;margin-top:3px">' + inputNoCache.toLocaleString() + '</div></div>' +

            ) +
            '</div>';
    }

    if (!modelHtml && !quotaHtml) {
        modelHtml = '<div style="padding:24px;text-align:center;color:#64748b;font-size:13px">暂无用量数据</div>';
    }

    const maxPct = Math.max(q5h.used_pct || 0, qWeekly.used_pct || 0);
    const badge = remainingDays > 0 ? getStatusBadge(maxPct) : getStatusBadge(70);

    return '<div class="plan-card" style="flex:0 0 100%;min-width:0">' +
        '<div class="card-header"><div><div class="title platform-title" style="font-size:22px;cursor:pointer" data-platform="minimax">' + brandIcon('minimax', 20) + 'MiniMax</div><div class="subtitle">' + escHtml(planName) + (accountName ? ' · ' + escHtml(accountName) : '') + (remainingDays ? ' · ' + remainingDays + '天到期' : '') + '</div></div><span class="status-badge ' + badge.cls + '">' + badge.text + '</span></div>' +

        '<div style="padding:0 16px 12px">' + quotaHtml + modelHtml + '</div>' +

function formatCompact(n) {
    if (!n || n === 0) return '0';
    if (n >= 1e8) return (n/1e8).toFixed(1) + '亿';
    if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
    if (n >= 1e4) return (n/1e3).toFixed(0) + 'k';
    return n.toLocaleString();
}

async function loadSortWeights() {
    try {
        const [credsResp] = await Promise.all([
            authFetch('/api/admin/credentials').then(r=>r.json())
        ]);
        const container = document.getElementById('sort-weight-list');
        if (!container) return;
        
        const activePlatforms = [...new Set(credsResp.map(c => c.platform))];
        // minimax 的 api_key 是中转站，在排序里显示为 minimax_gateway
        const expandedPlatforms = [];
        const seen = new Set();
        for (const p of activePlatforms) {
            if (p === 'minimax') {
                if (!seen.has('minimax')) { expandedPlatforms.push('minimax'); seen.add('minimax'); }
                if (!seen.has('minimax_gateway')) { expandedPlatforms.push('minimax_gateway'); seen.add('minimax_gateway'); }
            } else {
                if (!seen.has(p)) { expandedPlatforms.push(p); seen.add(p); }
            }
        }
        const finalPlatforms = expandedPlatforms;
        if (!finalPlatforms.length) {
            container.innerHTML = '<span style="font-size:12px;color:#4b5563">暂无有效平台</span>';
            return;
        }
        
        // 从 localStorage 读保存的顺序，没有则用原来的
        const saved = JSON.parse(localStorage.getItem('platform_order') || '[]');
        const ordered = saved.filter(p => finalPlatforms.includes(p));
        for (const p of finalPlatforms) {
            if (!ordered.includes(p)) ordered.push(p);
        }
        
        container.innerHTML = ordered.map(p => {
            const name = NAMES[p] || p;
            const icon = {deepseek:'🔮',xiaomi:'🧸',tencent:'🔷',volcano:'🌋',minimax:'🤖',minimax_gateway:'🔄',gpt_gateway:'🔌'}[p] || '📊';

                'style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d1117;border:1px solid #1e293b;border-radius:8px;cursor:grab;user-select:none;-webkit-user-select:none;font-size:13px;color:#e2e8f0">' +
                '<span style="font-size:16px;line-height:1;cursor:grab">⠿</span>' +
                '<span>' + icon + '</span>' +
                '<span style="flex:1">' + name + '</span>' +
                '</div>';
        }).join('');
        
        // 绑定事件：桌面拖拽 + 移动端触控
        container.querySelectorAll('[draggable]').forEach(el => {
            el.addEventListener('dragstart', onDragStart);
            el.addEventListener('dragend', onDragEnd);
            el.addEventListener('dragover', onDragOver);
            el.addEventListener('drop', onDrop);
            // 移动端触控
            el.addEventListener('touchstart', onTouchStart, {passive:false});
            el.addEventListener('touchmove', onTouchMove, {passive:false});
            el.addEventListener('touchend', onTouchEnd, {passive:false});
        });
        container.addEventListener('dragover', e => e.preventDefault());
    } catch(e) { console.error(e); }
}

/* ====== 拖动排序核心逻辑 ====== */
let _dragSrc = null;
function onDragStart(e) {
    _dragSrc = this;
    this.style.opacity = '0.4';
    this.style.background = '#1e293b';
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', this.dataset.platform);
}
function onDragOver(e) {
    if (e.preventDefault) e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    return false;
}
function onDragEnd(e) {
    this.style.opacity = '';
    this.style.background = '';
    _dragSrc = null;
    // 清理所有高亮
    document.querySelectorAll('#sort-weight-list > div').forEach(d => {
        d.style.borderTop = ''; d.style.borderBottom = '';
    });
}
function onDrop(e) {
    e.stopPropagation();
    e.preventDefault();
    if (!_dragSrc || _dragSrc === this) return;
    const container = document.getElementById('sort-weight-list');
    const items = [...container.children];
    const fromIdx = items.indexOf(_dragSrc);
    const toIdx = items.indexOf(this);
    if (fromIdx < toIdx) {
        this.parentNode.insertBefore(_dragSrc, this.nextSibling);
    } else {
        this.parentNode.insertBefore(_dragSrc, this);
    }
    // 保存顺序
    _saveSortOrder();
    onDragEnd.call(_dragSrc);
}
function _saveSortOrder() {
    const container = document.getElementById('sort-weight-list');
    const order = [...container.children].map(el => el.dataset.platform);
    localStorage.setItem('platform_order', JSON.stringify(order));
    toast('排序已保存', 'success');
}

/* ====== 移动端触控拖动 ====== */
let _touchSrc = null, _touchClone = null, _touchY = 0, _touchStartY = 0;
function onTouchStart(e) {
    _touchSrc = this;
    _touchStartY = e.touches[0].clientY;
    _touchY = e.touches[0].clientY;
    this.style.opacity = '0.4';
    this.style.background = '#1e293b';
}
function onTouchMove(e) {
    e.preventDefault();
    if (!_touchSrc) return;
    _touchY = e.touches[0].clientY;
    const container = document.getElementById('sort-weight-list');
    const items = [...container.children];
    // 找到手指位置的元素
    for (const item of items) {
        if (item === _touchSrc) continue;
        const rect = item.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (_touchY < mid) {
            container.insertBefore(_touchSrc, item);
            return;
        }
    }
    container.appendChild(_touchSrc);
}
function onTouchEnd(e) {
    if (!_touchSrc) return;
    _touchSrc.style.opacity = '';
    _touchSrc.style.background = '';
    _saveSortOrder();
    _touchSrc = null;
}

async function checkCredential(platform) {
    const resultEl = document.getElementById('check-result-'+platform);
    resultEl.innerHTML = '<span class="cred-check-loading">⏳ 检查中...</span>';
    try {
        const resp = await authFetch('/api/admin/check-credential/'+platform, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
        const result = await resp.json();
        if (result.error && !result.details) {
            resultEl.innerHTML = '<div class="cred-check-result cred-check-fail">❌ '+escHtml(result.error)+'</div>';
            return;
        }
        const allOk = result.status === 'ok';
        let html = '<div class="cred-check-result '+(allOk?'cred-check-ok':'cred-check-fail')+'">';
        html += allOk ? '✅ 凭证有效' : '❌ 凭证异常';
        if (result.duration_ms) html += ' <span style="opacity:0.7">('+result.duration_ms+'ms)</span>';
        if (result.details) {
            result.details.forEach(d => {
                const name = NAMES[d.platform] || d.platform;
                if (d.status === 'ok') {
                    html += '<div style="margin-top:2px">✅ '+escHtml(name)+': '+escHtml(d.remaining||'正常')+'</div>';
                } else {
                    html += '<div style="margin-top:2px">❌ '+escHtml(name)+': '+escHtml(d.error||'失败');
                    if (d.cookie_expired) html += ' 🍪已失效';
                    html += '</div>';
                }
            });
        }
        html += '</div>';
        resultEl.innerHTML = html;
    } catch(e) {
        resultEl.innerHTML = '<div class="cred-check-result cred-check-fail">❌ 请求失败: '+escHtml(e.message)+'</div>';
    }
}

        const cfg = platformConfigs[platform];
        placeholder = credType === 'cookie'
            ? (cfg.cookie_hint || '粘贴新的 Cookie...')
            : (cfg.api_key_hint || '粘贴新的 API Key...');
    }
    div.innerHTML = '<div style="padding:12px 20px;border-top:2px solid #3b82f6;background:rgba(59,130,246,0.05)">' +
        '<textarea id="update-data-'+platform+'" placeholder="'+escHtml(placeholder)+'" ' +
        'style="width:100%;min-height:80px;font-size:13px;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;resize:vertical;margin-bottom:8px;font-family:Consolas,Fira Code,monospace"></textarea>' +
        '<div style="display:flex;gap:8px">' +
        '<button class="btn btn-primary" onclick="doUpdateCred(\''+platform+'\',\''+credType+'\')">💾 保存</button>' +
        '<button class="btn btn-outline" onclick="hideUpdateCred(\''+platform+'\')">取消</button>' +
        '</div></div>';
    card.appendChild(div);
    setTimeout(() => document.getElementById('update-data-'+platform).focus(), 100);
}

function hideUpdateCred(platform) {
    const row = document.getElementById('update-row-'+platform);
    if (row) row.remove();
}

async function doUpdateCred(platform, credType) {
    const data = document.getElementById('update-data-'+platform).value.trim();
    if (!data) { toast('请输入凭证数据', 'error'); return; }
    try {
        const resp = await authFetch('/api/admin/credentials', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({platform, credential_type: credType, credential_data: data})
        });
        const result = await resp.json();
        if (result.status === 'ok') {
            toast((NAMES[platform]||platform)+' 凭证已更新', 'success');
            hideUpdateCred(platform);
            loadCredentials();
            // 更新成功后立即检查凭证并采集数据
            await checkAndRefreshAfterSave(platform);
        } else {
            toast(result.error || '更新失败', 'error');
        }
    } catch(e) {
        if (e.message !== '未授权') toast('请求失败: '+e.message, 'error');
    }
}

// ============ API 密钥管理（TOTP） ============
async function loadApiKeys() {
    const el = document.getElementById('api-key-list');
    if (!el) return;
    try {
        const resp = await authFetch('/api/admin/api_keys');
        const keys = await resp.json();
        const active = keys.filter(function(k) { return !k.revoked; });
        if (!active.length) { el.innerHTML = '<div style="color:#64748b;padding:6px 0">暂无密钥</div>'; return; }
        el.innerHTML = active.map(function(k) {
            return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1e293b">' +
                '<span>'+escHtml(k.name)+'</span>' +
                '<span style="font-size:11px;color:#64748b">🟢 有效</span>' +
                '<span style="font-size:11px;color:#64748b;margin-left:auto">'+escHtml(k.created_at_fmt||'')+'</span>' +
                '<button class="btn btn-danger" style="font-size:11px;padding:2px 8px;margin-left:8px" onclick="revokeApiKey('+k.id+')">吊销</button>' +
                '</div>';
        }).join('');
    } catch(e) {
        el.innerHTML = '<div style="color:#ef4444;padding:6px 0">加载失败</div>';
    }
}

async function createApiKey() {
    var name = document.getElementById('api-key-name').value.trim() || 'Chrome Extension';
    try {
        var resp = await authFetch('/api/admin/api_keys', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name}) });
        var data = await resp.json();
        if (data.id) {
            toast('密钥已生成', 'success');
            var keyStr = data.name+'|'+data.secret;
            window._lastKeyStr = keyStr;

            var keyList = document.getElementById('api-key-list');
            var greenHtml =
                '<div id="new-key-box" style="background:#064e3b;border:1px solid #059669;border-radius:8px;padding:12px;margin-bottom:8px">' +
                '<div style="font-size:11px;color:#6ee7b7;margin-bottom:4px">⚠️ 关闭后无法再次查看，请立即复制到插件</div>' +
                '<div style="background:#0f172a;color:#4ade80;padding:8px 12px;border-radius:6px;font-family:monospace;font-size:13px;word-break:break-all;user-select:all">'+escHtml(keyStr)+'</div>' +
                '<div style="margin-top:8px"><button class="btn btn-primary" onclick="copyApiKey()">📋 复制到剪贴板</button></div>' +
                '</div>';

            // 清除旧绿色框，插入新绿色框到最顶部
            var oldBox = document.getElementById('new-key-box');
            if (oldBox) oldBox.remove();
            var temp = document.createElement('div');
            temp.innerHTML = greenHtml;
            keyList.prepend(temp.firstElementChild);
        } else {
            toast(data.detail || '生成失败', 'error');
        }
    } catch(e) {
        toast('请求失败', 'error');
    }
}

function copyApiKey() {
    if (window._lastKeyStr) {
        navigator.clipboard.writeText(window._lastKeyStr);
        toast('密钥已复制到剪贴板', 'success');
        // 复制后自动关闭绿色提示框
        var box = document.getElementById('new-key-box');
        if (box) {
            box.style.transition = 'opacity 0.3s';
            box.style.opacity = '0';
            setTimeout(function() { if (box && box.parentNode) box.parentNode.removeChild(box); }, 300);
        }
    }
}

async function revokeApiKey(id) {
    if (!confirm('确定吊销此密钥？')) return;
    try {
        var resp = await authFetch('/api/admin/api_keys/'+id, { method:'DELETE' });
        var data = await resp.json();
        if (data.status==='ok') { toast('已吊销', 'success'); loadApiKeys(); }
        else { toast(data.detail||'吊销失败', 'error'); }
    } catch(e) { toast('请求失败', 'error'); }
}

async function loadSchedulerStatus() {
    try {
        const resp = await authFetch('/api/admin/scheduler');
        const data = await resp.json();
        const dot = document.getElementById('scheduler-dot'), label = document.getElementById('scheduler-label');
        if (data.running) { dot.className='status-dot-admin dot-running'; label.textContent='运行中'; label.style.color='#4ade80'; }
        else { dot.className='status-dot-admin dot-stopped'; label.textContent='已停止'; label.style.color='#6b7280'; }
        document.getElementById('scheduler-interval-label').textContent = '间隔: ' + data.interval + '秒';
    } catch(e) { console.error(e); }
}

async function schedulerAction(action) {
    try {
        const resp = await authFetch('/api/admin/scheduler', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action})});
        const result = await resp.json();
        toast(result.message, result.status==='ok'?'success':'info');
        loadSchedulerStatus();
    } catch(e) { if (e.message !== '未授权') toast('请求失败', 'error'); }
}

async function updateInterval() {
    const interval = parseInt(document.getElementById('interval-input').value);
    if (interval < 10 || interval > 120) { toast('间隔范围10~120秒', 'error'); return; }
    try {
        await authFetch('/api/admin/scheduler', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({interval})});
        toast('间隔已更新', 'success'); loadSchedulerStatus();
    } catch(e) { if (e.message !== '未授权') toast('请求失败', 'error'); }
}

async function refreshNow() {
    const ico = document.getElementById('refresh-icon');
    if (ico) { ico.style.transition = 'transform 0.6s'; ico.style.transform = 'rotate(360deg)'; }
    toast('正在刷新所有平台...', 'info');
    try {
        const resp = await authFetch('/api/admin/refresh', {method:'POST'});
        const result = await resp.json();
        if (result.status==='ok') {
            const results = result.results||{};
            const summary = Object.entries(results).map(([k,v])=>(NAMES[k]||k)+': '+(v.status==='success'?'✅':'❌ '+(v.error||''))).join('\n');
            toast('刷新完成:\n'+summary, 'success');
            loadRefreshLog(); load();
        }
    } catch(e) { if (e.message !== '未授权') toast('刷新失败: '+e.message, 'error'); }
    if (ico) setTimeout(() => { ico.style.transition = 'none'; ico.style.transform = 'rotate(0deg)'; }, 800);
}

/* ====== 日志页 ====== */
let _logOffset = 0, _logLevel = '', _logPlatform = '', _logSearch = '';

async function loadLogs(append=false) {
    if (!append) { _logOffset = 0; document.getElementById('log-entries').innerHTML = ''; }
    try {
        const params = new URLSearchParams({limit:'50', offset:String(_logOffset)});
        if (_logLevel) params.set('level', _logLevel);
        if (_logPlatform) params.set('platform', _logPlatform);
        if (_logSearch) params.set('search', _logSearch);
        const resp = await authFetch('/api/admin/refresh-log?'+params.toString());
        const logs = await resp.json();
        const container = document.getElementById('log-entries');
        if (!append) container.innerHTML = '';
        if (!logs.length && !append) {
            container.innerHTML = '<div style="text-align:center;color:#4b5563;padding:32px">暂无日志</div>';
            document.getElementById('log-load-more').style.display = 'none';
            return;
        }
        const html = logs.map(l => {
            const lvl = l.level || 'INFO';
            const lvlLabel = {INFO:'🟢',WARN:'🟡',ERROR:'🔴'}[lvl] || '';
            const statusIcon = l.status==='success'?'✅':l.status==='failed'?'❌':'⚠️';
            const dur = l.duration_ms ? l.duration_ms+'ms' : '';
            return '<div class="log-entry">' +
                '<span class="log-entry-time">'+escHtml(l.timestamp_fmt||'-')+'</span>' +
                '<span class="log-entry-level lvl-'+escHtml(lvl)+'">'+lvlLabel+' '+escHtml(lvl)+'</span>' +
                '<span class="log-entry-platform">'+escHtml(NAMES[l.platform]||l.platform)+'</span>' +
                '<span class="log-entry-msg">'+statusIcon+' '+escHtml(l.message||'-')+'</span>' +
                (dur ? '<span class="log-entry-dur">'+escHtml(dur)+'</span>' : '') +
                '</div>';
        }).join('');
        container.innerHTML += html;
        _logOffset += logs.length;
        const moreBtn = document.getElementById('log-load-more');
        if (logs.length < 50) {
            moreBtn.style.display = 'none';
        } else {
            moreBtn.style.display = '';
            document.getElementById('log-more-btn').textContent = '加载更多 ('+_logOffset+' 条已加载)';
        }
        // 填充平台筛选下拉
        if (!append) {
            const sel = document.getElementById('log-platform-filter');
            if (sel.options.length <= 1) {
                const platforms = [...new Set(logs.map(l=>l.platform))];
                platforms.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p; opt.textContent = NAMES[p] || p;
                    sel.appendChild(opt);
                });
            }
        }
    } catch(e) { console.error(e); }
}

function filterLogLevel(level) {
    _logLevel = level;
    document.querySelectorAll('.log-lvl').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector('.log-lvl[data-lvl="'+level+'"]');
    if (btn) btn.classList.add('active');
    loadLogs();
}

// 更新搜索和平台筛选事件
document.addEventListener('DOMContentLoaded', function() {
    const platformSel = document.getElementById('log-platform-filter');
    const searchInput = document.getElementById('log-search');
    if (platformSel) platformSel.addEventListener('change', function() { _logPlatform = this.value; loadLogs(); });
    if (searchInput) searchInput.addEventListener('input', function() { _logSearch = this.value; loadLogs(); });
});

/* keep legacy for admin tab */
async function loadRefreshLog() {
    try {
        const resp = await authFetch('/api/admin/refresh-log?limit=10');
        const logs = await resp.json();
        const tbody = document.getElementById('log-tbody');
        if (!tbody) return;
        if (!logs.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#4b5563">暂无刷新记录</td></tr>'; return; }
        tbody.innerHTML = logs.map(l => '<tr><td>'+escHtml(l.timestamp_fmt||'-')+'</td><td>'+escHtml(NAMES[l.platform]||l.platform)+'</td><td class="log-'+escHtml(l.status)+'">'+(l.status==='success'?'✅ 成功':l.status==='failed'?'❌ 失败':'⚠️ 错误')+'</td><td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+escHtml(l.message||'')+'">'+escHtml(l.message||'-')+'</td></tr>').join('');
    } catch(e) { console.error(e); }
}

async function clearRefreshLog() {
    try {
        await authFetch('/api/admin/refresh-log', {method:'DELETE'});
        toast('日志已清空', 'success');
        const tbody = document.getElementById('log-tbody');
        if (tbody) tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#4b5563">暂无刷新记录</td></tr>';
        loadLogs();
    } catch(e) { if (e.message !== '未授权') toast('清空失败', 'error'); }
}

/* ====== 初始化 ====== */
document.getElementById('version-tag').textContent = APP_VERSION;

// 启动时检查认证状态
checkAuthStatus().then(() => {
    // 根据登录状态渲染监控页的隐藏按钮
    lastDataHash = ''; // 强制重新渲染
});

load();
// 自动刷新：每1秒检查一次
let lastRefreshTime = Date.now();
;(async function startAutoRefresh() {
    setInterval(async () => {
        const iv = window._refreshInterval || 30;
        const elapsed = Math.floor((Date.now() - lastRefreshTime) / 1000);
        const remain = Math.max(0, iv - elapsed);
        const cdEl = document.getElementById('cd');
        cdEl.textContent = remain;
        // 颜色: 绿色(>15s) → 黄色(>5s) → 红色(≤5s)
        cdEl.style.color = remain > 15 ? '#4ade80' : remain > 5 ? '#fbbf24' : '#ef4444';
        
        if (remain <= 0) {
            const oldHash = lastDataHash;
            await load();
            lastRefreshTime = Date.now();
            if (lastDataHash !== oldHash) toast('数据已刷新', 'info');
        }
    }, 1000);
})();
setInterval(updateCountdowns, 60000);

// 定期检查认证状态（5分钟），防止 token 过期后 UI 不一致
setInterval(async () => {
    const status = await checkAuthStatus();
    if (!status.authenticated && document.getElementById('page-admin').classList.contains('active')) {
        renderAuthArea();
    }
}, 300000);
</script>
